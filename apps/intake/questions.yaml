# ============================================================
# apps/intake/questions.yaml — 웹 intake 폼 질문 카탈로그
# ============================================================
#
# 목적:
#   숨고/크몽 의뢰인(계약 전)이 스스로 needs를 입력하는 웹폼.
#   PM delivery loop step 0~2 (Intake → Discover → Specify) 디지털화.
#   제출 결과 → profiles/<slug>.yaml 초안으로 자동 변환.
#
# 단일 진실 원칙:
#   질문 수정은 이 파일만 고친다. engineer는 이 파일을 읽어 폼을 렌더링.
#
# ── 필드 의미 ────────────────────────────────────────────────
# id          : ASCII slug (폼 필드 key, 변경 불가 — profile 매핑 anchor)
# label       : 사용자에게 보이는 한국어 질문 텍스트
# hint        : 선택적 보조 설명 (입력창 아래 작은 글씨)
# type        : text | textarea | select | multiselect | radio
# options     : select/multiselect/radio 전용 — {value: str, label: str}[]
# required    : true | false
# maps_to     : profile schema 경로 또는 needs_note 필드
#               needs_note 필드: needs_note.who | what | why | current | frequency | cost_of_pain
# persona     : all | ceo | staff | it
#               (all = 공통 섹션 — 모든 페르소나에게 출력됨)
# section     : 폼 내 섹션 그룹 레이블
# show_if     : 조건부 표시 — {trigger_qid: value} 또는 {trigger_qid: [value1, value2]}
#               trigger_qid 의 현재 응답이 지정 값(들)에 포함될 때만 이 질문을 표시.
#               multiselect trigger: 선택값과 지정 값 사이에 교집합이 있으면 표시.
#               show_if 없으면 항상 표시. required:false 와 함께 사용하는 것이 원칙.
#               app.py _show_if_met() / form.html initShowIf() 가 이 필드를 읽는다.
#
# ── profile schema 경로 약어 ─────────────────────────────────
# customer.*         : profiles/<slug>.yaml customer 블록
# stack.*            : stack 블록 (frontend/backend/ddl 선택)
# ddl.dialect        : DB 방언
# domains[].entities : 관리할 데이터 항목(엔티티) 후보
# billing.*          : 비용 블록
# datasource.*       : 데이터소스 블록
# overlay.*          : 배포 오버레이 블록
# ============================================================

schema_version: 1
form_slug: intake-v1
form_title: "도입 상담 신청"
form_description: >
  아래 정보를 입력해 주시면 담당자가 검토 후 1~2 영업일 내에 연락드립니다.
  솔직하게 현재 상황을 알려주실수록 정확한 제안이 가능합니다.
  입력 내용은 제안서 작성에만 사용되며 외부에 공유되지 않습니다.


# ============================================================
# 섹션 0 — 공통: 기본 정보 (모든 페르소나)
# ============================================================
questions:

  # ── 연락처 & 회사 정보 ─────────────────────────────────────

  - id: contact_email
    section: "기본 정보"
    persona: all
    label: "연락받으실 이메일 주소를 입력해 주세요."
    hint: "제안서 및 일정 안내를 이메일로 보내드립니다."
    type: text
    required: true
    maps_to: customer.contact

  - id: contact_phone
    section: "기본 정보"
    persona: all
    label: "연락처 전화번호 (선택)"
    hint: "이메일보다 전화를 선호하신다면 입력해 주세요."
    type: text
    required: false
    maps_to: needs_note.who

  - id: company_name
    section: "기본 정보"
    persona: all
    label: "회사(기관) 이름 (선택)"
    hint: "비워두셔도 됩니다. 제안서 작성 시 참고용입니다."
    type: text
    required: false
    maps_to: customer.display

  - id: industry
    section: "기본 정보"
    persona: all
    label: "주요 업종이 무엇인가요?"
    hint: "가장 가까운 항목을 선택해 주세요."
    type: select
    required: true
    maps_to: customer.industry
    options:
      - value: manufacturing
        label: "제조·생산"
      - value: logistics
        label: "물류·유통·창고"
      - value: retail
        label: "소매·이커머스"
      - value: finance
        label: "금융·보험"
      - value: medical
        label: "의료·병원·제약"
      - value: legal
        label: "법무·법률"
      - value: construction
        label: "건설·엔지니어링"
      - value: education
        label: "교육·학원"
      - value: service
        label: "서비스업(IT, 컨설팅 등)"
      - value: public
        label: "공공·비영리"
      - value: generic
        label: "위 항목에 해당 없음 / 잘 모르겠어요"

  - id: data_domains
    section: "기본 정보"
    persona: all
    label: "이 시스템으로 관리하고 싶은 데이터 항목을 모두 선택해 주세요."
    hint: "지금 엑셀이나 수기로 관리 중인 것, 또는 관리가 안 돼서 불편한 것을 고르시면 됩니다."
    type: multiselect
    required: false
    maps_to: domains[].entities
    show_if:
      deliverable_kind: business-system
    options:
      - value: customer
        label: "고객 정보 (거래처, 연락처)"
      - value: order
        label: "주문·견적·계약"
      - value: inventory
        label: "재고·자재·부품"
      - value: hr
        label: "직원·인사 정보"
      - value: hr_leave
        label: "휴가·근태·일정"
      - value: approval
        label: "결재·승인 흐름"
      - value: asset
        label: "자산·장비·시설"
      - value: finance_ledger
        label: "매출·비용·정산"
      - value: document
        label: "문서·파일 관리"
      - value: report
        label: "현황 조회·보고서"
      - value: other
        label: "기타 (아래 자유 입력란에 적어주세요)"

  - id: existing_system
    section: "기본 정보"
    persona: all
    label: "현재 같은 업무에 쓰고 있는 도구나 시스템이 있나요?"
    hint: "예: 엑셀, 네이버 스프레드시트, 카카오워크, ERP 이름 등"
    type: radio
    required: false
    maps_to: needs_note.current
    show_if:
      deliverable_kind: business-system
    options:
      - value: excel_manual
        label: "엑셀 또는 수기로 처리 중"
      - value: messenger
        label: "카카오톡·메신저·이메일로 처리 중"
      - value: legacy_system
        label: "오래된 프로그램(ERP·사내 시스템)이 있지만 불편함"
      - value: cloud_saas
        label: "클라우드 SaaS(구글 워크스페이스, 노션 등) 사용 중"
      - value: none
        label: "별도 도구 없이 처리 중"
      - value: unknown
        label: "잘 모르겠어요"

  - id: persona_role
    section: "기본 정보"
    persona: all
    label: "이 양식을 작성하시는 분의 역할이 무엇인가요?"
    hint: "역할에 따라 추가 질문이 달라집니다."
    type: radio
    required: true
    maps_to: needs_note.who
    options:
      - value: ceo
        label: "대표 / 임원 (의사결정권자)"
      - value: staff
        label: "업무담당자 (실제 사용할 분)"
      - value: it
        label: "IT 담당자 (설치·운영 책임자)"
      - value: other
        label: "기타 / 잘 모르겠어요"

  # ── 산출물 종류 분기 (섹션 0, persona_role 다음) ───────────

  - id: deliverable_kind
    section: "기본 정보"
    persona: all
    label: "원하시는 것이 무엇인가요?"
    hint: "선택에 따라 이후 질문이 달라집니다."
    type: radio
    required: true
    maps_to: stack.deliverable_kind
    options:
      - value: business-system
        label: "업무 시스템 — 데이터 관리·업무 자동화: 재고/주문/고객관리 등"
      - value: marketing-site
        label: "홈페이지·런칭 페이지 — 회사·제품 소개·마케팅"

  # ── marketing-site 전용 후속질문 ───────────────────────────

  - id: ms_brand_name
    section: "홈페이지 정보"
    persona: all
    label: "회사 또는 브랜드 이름을 입력해 주세요."
    hint: "홈페이지에 표시될 이름입니다."
    type: text
    required: true
    maps_to: needs_note.what
    show_if:
      deliverable_kind: marketing-site

  - id: ms_tagline
    section: "홈페이지 정보"
    persona: all
    label: "한 줄 슬로건 (선택)"
    hint: "예: '더 빠른 결제, 더 나은 경험' — 메인 화면에 들어갈 짧은 문구입니다."
    type: text
    required: false
    maps_to: needs_note.what
    show_if:
      deliverable_kind: marketing-site

  - id: ms_target_audience
    section: "홈페이지 정보"
    persona: all
    label: "주요 방문자(잠재 고객층)는 누구인가요?"
    hint: "예: 중소기업 대표, 20~30대 직장인, 인테리어에 관심 있는 주부 등 — 구체적일수록 좋습니다."
    type: textarea
    required: true
    maps_to: needs_note.who
    show_if:
      deliverable_kind: marketing-site

  - id: ms_pages
    section: "홈페이지 정보"
    persona: all
    label: "홈페이지에 포함할 페이지를 모두 선택해 주세요."
    hint: "홈(Home) 페이지는 항상 포함됩니다. 추가로 필요한 페이지를 선택하세요."
    type: multiselect
    required: true
    maps_to: needs_note.what
    show_if:
      deliverable_kind: marketing-site
    options:
      - value: about
        label: "회사 소개 (About)"
      - value: services_features
        label: "서비스·기능 소개"
      - value: pricing
        label: "가격·요금제"
      - value: testimonials
        label: "고객 후기·사례"
      - value: faq
        label: "자주 묻는 질문 (FAQ)"
      - value: contact
        label: "문의·연락처"

  - id: ms_tone
    section: "홈페이지 정보"
    persona: all
    label: "홈페이지의 분위기(톤)를 선택해 주세요."
    hint: "선택한 톤에 맞는 디자인 테마가 자동으로 적용됩니다."
    type: select
    required: true
    maps_to: needs_note.what
    show_if:
      deliverable_kind: marketing-site
    options:
      - value: bold-energetic
        label: "강렬하고 역동적 — SaaS·테크·스타트업 느낌 (Aurora 테마)"
      - value: minimal-editorial
        label: "깔끔하고 세련된 편집 디자인 — 에이전시·컨설팅·전문직 느낌 (Studio 테마)"

  - id: ms_reference_sites
    section: "홈페이지 정보"
    persona: all
    label: "참고하고 싶은 사이트 URL이 있으신가요? (선택)"
    hint: "마음에 드는 홈페이지 주소를 적어주시면 디자인 방향 설정에 참고합니다."
    type: textarea
    required: false
    maps_to: needs_note.why
    show_if:
      deliverable_kind: marketing-site

  - id: ms_primary_cta
    section: "홈페이지 정보"
    persona: all
    label: "방문자가 홈페이지에서 하길 바라는 행동은 무엇인가요? (선택)"
    hint: "예: 상담 신청, 무료 체험 시작, 제품 구매, 카카오톡 문의 등"
    type: text
    required: false
    maps_to: needs_note.why
    show_if:
      deliverable_kind: marketing-site


  # ============================================================
  # 섹션 1 — CEO 페르소나 전용 (사업 임팩트·비용·리스크)
  # ============================================================

  - id: ceo_pain_bottleneck
    section: "현재 상황 (대표·임원용)"
    persona: ceo
    label: "지금 사업에서 가장 자주 막히는 업무 병목이 무엇인가요?"
    hint: "사람이 수작업으로 처리하거나, 엑셀·메모로 우회하는 일이 있다면 구체적으로 적어주세요."
    type: textarea
    required: true
    maps_to: needs_note.what

  - id: ceo_pain_frequency
    section: "현재 상황 (대표·임원용)"
    persona: ceo
    label: "그 병목이 얼마나 자주 반복되나요?"
    type: radio
    required: true
    maps_to: needs_note.frequency
    options:
      - value: daily
        label: "매일"
      - value: weekly
        label: "주 1~3회"
      - value: monthly
        label: "월 1~3회"
      - value: occasional
        label: "가끔 (분기 이하)"
      - value: unknown
        label: "잘 모르겠어요"

  - id: ceo_cost_of_pain
    section: "현재 상황 (대표·임원용)"
    persona: ceo
    label: "그 문제가 해결되지 않으면 어떤 비용이 발생하고 있나요?"
    hint: "인건비 낭비, 실수로 인한 손실, 고객 불만, 기회 손실 등 — 금액이 아니어도 됩니다."
    type: textarea
    required: false
    maps_to: needs_note.cost_of_pain

  - id: ceo_success_criteria
    section: "현재 상황 (대표·임원용)"
    persona: ceo
    label: "6개월 후 '이것만 바뀌면 성공'이라고 말할 수 있는 결과가 무엇인가요?"
    hint: "숫자나 구체적인 변화로 표현해 주시면 제안서 작성에 큰 도움이 됩니다. 예: '주문 입력 오류 0건', '결재 대기 시간 하루 이내'"
    type: textarea
    required: true
    maps_to: needs_note.why

  - id: ceo_user_count
    section: "현재 상황 (대표·임원용)"
    persona: ceo
    label: "이 시스템을 사용할 직원은 대략 몇 명인가요?"
    type: radio
    required: true
    maps_to: needs_note.who
    options:
      - value: "1-5"
        label: "1~5명"
      - value: "6-20"
        label: "6~20명"
      - value: "21-50"
        label: "21~50명"
      - value: "51-100"
        label: "51~100명"
      - value: "100+"
        label: "100명 이상"
      - value: unknown
        label: "잘 모르겠어요"

  - id: ceo_budget_setup
    section: "예산 (대표·임원용)"
    persona: ceo
    label: "초기 구축 예산을 어느 수준으로 생각하고 계신가요?"
    hint: "범위를 선택해 주세요. 정확하지 않아도 됩니다."
    type: radio
    required: false
    maps_to: billing.setup_cost_krw
    options:
      - value: "under_300"
        label: "300만원 미만"
      - value: "300_500"
        label: "300만~500만원"
      - value: "500_1000"
        label: "500만~1,000만원"
      - value: "over_1000"
        label: "1,000만원 이상"
      - value: unknown
        label: "아직 정해지지 않았어요"

  - id: ceo_data_security
    section: "예산 (대표·임원용)"
    persona: ceo
    label: "데이터를 외부 클라우드 서버에 보관해도 괜찮으신가요, 아니면 사내 서버에만 있어야 하나요?"
    hint: "법적 규제, 보안 정책, 기밀 데이터 여부 등을 고려해 주세요."
    type: radio
    required: false
    maps_to: datasource.self_host_required
    show_if:
      deliverable_kind: business-system
    options:
      - value: onpremise_only
        label: "사내 서버(온프레미스)에만 보관해야 함"
      - value: cloud_ok
        label: "클라우드 외부 보관도 괜찮음"
      - value: hybrid
        label: "일부 데이터만 사내에 — 혼용 가능"
      - value: unknown
        label: "잘 모르겠어요 / 전문가 판단에 맡기고 싶어요"


  # ============================================================
  # 섹션 2 — 업무담당자(staff) 페르소나 전용 (일상 업무·불편·빈도)
  # ============================================================

  - id: staff_daily_pain
    section: "현재 상황 (업무담당자용)"
    persona: staff
    label: "하루 업무 중 가장 귀찮거나 오래 걸리는 반복 작업이 무엇인가요?"
    hint: "예: 매일 같은 내용을 엑셀에 다시 입력한다, 재고를 확인하러 창고에 직접 가야 한다 등"
    type: textarea
    required: true
    maps_to: needs_note.what

  - id: staff_workaround_tool
    section: "현재 상황 (업무담당자용)"
    persona: staff
    label: "그 작업을 지금 어떤 방법으로 처리하고 있나요?"
    type: radio
    required: true
    maps_to: needs_note.current
    options:
      - value: excel
        label: "엑셀·구글 스프레드시트"
      - value: messenger
        label: "카카오톡·메신저"
      - value: email
        label: "이메일"
      - value: paper
        label: "수기·종이 문서"
      - value: legacy_system
        label: "기존 사내 프로그램"
      - value: mixed
        label: "여러 방법을 섞어서"
      - value: other
