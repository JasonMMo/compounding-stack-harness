<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}시스템 도입 상담 신청{% endblock %}</title>
  <!-- Pretendard Variable — Korean + Latin optimised variable font (OFL-1.1) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
  <!-- Open Props — CSS custom property primitives (MIT) -->
  <link rel="stylesheet" href="https://unpkg.com/open-props/open-props.min.css">
  <!-- Pico CSS v2 classless — semantic HTML baseline styles (MIT) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <nav>
      <span><strong>시스템 도입 상담</strong></span>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <small>입력 내용은 제안서 작성에만 사용되며 외부에 공유되지 않습니다.</small>
  </footer>
</body>
</html>
