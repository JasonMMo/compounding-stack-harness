# deploy/preview/studio-north.compose.yml
# Coolify dockercompose -- marketing-site static preview at studio-north.n9n.co.kr
# Multi-stage build (scaffold + astro SSG -> nginx). Build context = repo root.
# profile: studio-north  |  theme: atelier  |  DEMO_MODE=1 (contact form stubbed)
# A2 archetype (Creative Agency/Portfolio) -- structural diversity proof.
# theme-aware build: build-tokens-auto.mjs reads theme from the generated manifest.

services:
  web:
    build:
      context: .
      dockerfile: frontend/adapters/landing-astro/Dockerfile
      args:
        PROFILE_SLUG: studio-north
        DEMO_MODE: "1"
    ports:
      - "80"
    restart: unless-stopped
