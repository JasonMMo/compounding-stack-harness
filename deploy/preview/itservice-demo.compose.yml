# deploy/preview/itservice-demo.compose.yml
# Coolify dockercompose preview -- profile: itservice-demo
# Domain: https://itservice-demo.n9n.co.kr

services:

  backend:
    build:
      context: .
      dockerfile: backend/adapters/fastapi/Dockerfile
    environment:
      PORT: "8081"
      PYTHONIOENCODING: "utf-8"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/adapters/vanilla-htmx/Dockerfile
      args:
        UI_THEME: saas
    environment:
      FRONTEND_PORT: "5000"
      BACKEND_BASE_URL: "http://backend:8081"
      CONTRACT_DIR: "/app/middle/contract"
      PROFILE_MANIFEST: "/data/manifest/screen-manifest.json"
      PYTHONIOENCODING: "utf-8"
    volumes:
      - type: bind
        source: /data/coolify/manifests/itservice-demo/screen-manifest.json
        target: /data/manifest/screen-manifest.json
        read_only: true
    ports:
      - "5000"
    depends_on:
      - backend
    restart: unless-stopped
