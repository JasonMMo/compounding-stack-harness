# deploy/preview/lawfirm-demo.compose.yml
# Coolify dockercompose preview — profile: lawfirm-demo
# Build context: repo root (Coolify clones whole repo, build context = clone root)
#
# Domain: set via Coolify API PATCH docker_compose_domains (not SERVICE_FQDN_* env)
# Manifest: generated at deploy time by a one-shot manifest service, written to a
#           shared volume that the frontend mounts read-only. No host bind-mount,
#           no manual scp — a plain Redeploy regenerates it from current git so
#           new entities appear in nav automatically (mirrors taskflow-demo).
#
# Coolify deployment:
#   build_pack: dockercompose
#   docker_compose_location: /deploy/preview/lawfirm-demo.compose.yml
#   git_repository: git@github.com:JasonMMo/compounding-stack-harness.git
#   git_branch: master
#   private_key_uuid: s127pafarr46wlu1r2mre2te

services:

  backend:
    build:
      context: .
      dockerfile: backend/adapters/fastapi/Dockerfile
    environment:
      PORT: "8081"
      PYTHONIOENCODING: "utf-8"
      SEED_FILE: "/app/seed-data/lawfirm-demo.json"
    # No custom network — Coolify attaches containers to its uuid network only.
    # Traefik can only reach uuid-net IPs; declaring preview-net caused bistable 504.
    restart: unless-stopped

  manifest:
    # One-shot: regenerates screen-manifest.json from current git on each Redeploy
    # and writes it to the shared volume. Data comes from the backend's baked
    # SEED_FILE, so this generator does manifest-only (no HTTP seeding).
    build:
      context: .
      dockerfile: scripts/manifest-generator/Dockerfile
    environment:
      PYTHONIOENCODING: "utf-8"
      PROFILE_SLUG: "lawfirm-demo"
      MANIFEST_OUT: "/data/manifest/screen-manifest.json"
    volumes:
      - lawfirm_manifest:/data/manifest
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: frontend/adapters/vanilla-htmx/Dockerfile
      args:
        UI_THEME: saas
    environment:
      # Domain routing: set via Coolify API PATCH docker_compose_domains
      # [{"name":"frontend","domain":"https://lawfirm-demo.n9n.co.kr"}]
      # Do NOT use SERVICE_FQDN_* env here — set via API, not compose file.
      FRONTEND_PORT: "5000"
      BACKEND_BASE_URL: "http://backend:8081"
      CONTRACT_DIR: "/app/middle/contract"
      PROFILE_MANIFEST: "/data/manifest/screen-manifest.json"
      PYTHONIOENCODING: "utf-8"
      # Killer-app cross-link (B2): surfaces "AI 판례검색" banner + sidebar link
      # pointing to the legal-pro React app. Separate deployment/login (not SSO).
      KILLER_APP_URL: "https://legal-rag.n9n.co.kr/pro"
      KILLER_APP_LABEL: "AI 판례검색"
      KILLER_APP_DESC: "RAG 기반 판례 원문 검색 — 변호사용"
      # SECRET_KEY injected via Coolify environment variables (not in compose file)
    volumes:
      # Shared manifest volume — written by the one-shot manifest service.
      - lawfirm_manifest:/data/manifest:ro
    ports:
      - "5000"
    depends_on:
      backend:
        condition: service_started
      manifest:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  lawfirm_manifest:
    # Shared ephemeral volume: manifest service writes, frontend reads.
    # Local to this Coolify stack — no host bind-mount, no scp.
    # Regenerated on every Redeploy, so new entities appear in nav automatically.
