# deploy/preview/intake.compose.yml
# Coolify dockercompose preview — profile: intake
# Build context: repo root (Coolify clones whole repo, build context = clone root)
#
# Domain: intake.n9n.co.kr
# Data persistence: host /data/intake/data → container /app/data (bind mount)
#
# Coolify deployment:
#   build_pack: dockercompose
#   docker_compose_location: /deploy/preview/intake.compose.yml
#   git_repository: git@github.com:JasonMMo/compounding-stack-harness.git
#   git_branch: master
#   private_key_uuid: <coolify deploy key uuid>
#
# Growth-36 교훈: custom network 선언 금지 — Coolify uuid 넷만.
# INTAKE_ADMIN_PASSWORD: Coolify 환경변수로 주입 (compose 평문 금지).

services:
  intake:
    build:
      context: .
      dockerfile: apps/intake/Dockerfile
    environment:
      DATA_DIR: "/app/data"
      PYTHONIOENCODING: "utf-8"
      # INTAKE_ADMIN_PASSWORD: Coolify 환경변수 주입 — 여기 평문 금지
      # INTAKE_ADMIN_PASSWORD: ${INTAKE_ADMIN_PASSWORD}
    volumes:
      # 데이터 영속화: 호스트 /data/intake/data → 컨테이너 /app/data
      - type: bind
        source: /data/intake/data
        target: /app/data
    ports:
      - "8080"
    restart: unless-stopped
