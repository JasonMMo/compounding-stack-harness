# deploy/preview/taskflow-demo.compose.yml
# Coolify dockercompose preview — profile: taskflow-demo
# Build context: repo root (Coolify clones whole repo, build context = clone root)
#
# Domain: set via Coolify API PATCH docker_compose_domains (not SERVICE_FQDN_* env)
# Manifest: generated at build time inside seeder, then written to shared volume
#
# Coolify deployment:
#   build_pack: dockercompose
#   docker_compose_location: /deploy/preview/taskflow-demo.compose.yml
#   git_repository: git@github.com:JasonMMo/compounding-stack-harness.git
#   git_branch: master
#   private_key_uuid: s127pafarr46wlu1r2mre2te
#
# AUTH NOTE: login demo/demo is a stub (no real user DB). In-memory store — all
# data is lost on restart. This is intentional for repeated demo sessions.
# Do NOT store real customer data on this instance.

services:

  backend:
    build:
      context: .
      dockerfile: backend/adapters/fastapi/Dockerfile
    environment:
      PORT: "8081"
      PYTHONIOENCODING: "utf-8"
      # No SEED_FILE — taskflow uses in-memory store seeded via seeder service
      # Lite-AI similar-search (wire project.search-similar): base URL of the
      # internal embed sidecar. Set → mode=semantic; unset/unreachable → graceful
      # lexical fallback. Internal Docker service only (API비0, no cloud). G-125.
      # NOTE: backend intentionally does NOT depends_on embed — it starts and
      # serves lexical immediately, flipping to semantic once embed is healthy
      # (~60s model load). This preserves the honesty-fallback resilience.
      TASKFLOW_EMBED_URL: "http://embed:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/status/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  seeder:
    # One-shot: generates the manifest, then seeds 51 records into backend.
    # Restarts with backend on each Coolify redeploy → fresh demo data every time.
    build:
      context: .
      dockerfile: scripts/taskflow-seeder/Dockerfile
    environment:
      PYTHONIOENCODING: "utf-8"
      BACKEND_BASE_URL: "http://backend:8081"
      PROFILE_SLUG: "taskflow-demo"
      MANIFEST_OUT: "/data/manifest/screen-manifest.json"
    volumes:
      - taskflow_manifest:/data/manifest
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: frontend/adapters/vanilla-htmx/Dockerfile
      args:
        UI_THEME: saas
    environment:
      FRONTEND_PORT: "5000"
      BACKEND_BASE_URL: "http://backend:8081"
      CONTRACT_DIR: "/app/middle/contract"
      PROFILE_MANIFEST: "/data/manifest/screen-manifest.json"
      PYTHONIOENCODING: "utf-8"
      # SECRET_KEY injected via Coolify environment variables (not in compose file)
    volumes:
      - taskflow_manifest:/data/manifest:ro
    ports:
      - "5000"
    depends_on:
      backend:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Embed: reused legal-rag embed-adapter (8th-axis asset reuse, G-125) ──────
  # Model intfloat/multilingual-e5-base (768-dim, Korean+English) baked into the
  # image at build time; HF_HUB_OFFLINE at runtime → zero cloud, zero per-request
  # API cost. Internal only — no external port. Coolify isolates each project's
  # docker network, so the legal-rag stack's embed is NOT reachable here; this
  # stack runs its own instance.
  # CONTRACT (consumed by backend services/task_search.py::LocalEmbeddingProvider):
  #   POST /embed        {"text": str}        -> {"embedding": [float x 768]}   (query head)
  #   POST /embed/batch  {"texts": [str,...]} -> {"embeddings": [[float x 768]]} (passage head)
  #   GET  /health       -> 200
  embed:
    build:
      context: services/legal-rag/embed-adapter
      dockerfile: Dockerfile
    environment:
      EMBED_MODEL_NAME: "intfloat/multilingual-e5-base"
      # EMBED_QUERY_PREFIX / EMBED_PASSAGE_PREFIX defaults are correct (G-87).
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s   # baked model load ~10-20s; generous margin

volumes:
  taskflow_manifest:
    # Shared ephemeral volume: seeder writes manifest, frontend reads it.
    # Volume is local to this Coolify stack — no host bind-mount needed.
    # Data lost on stack removal (acceptable: manifest is regenerated on every deploy).
