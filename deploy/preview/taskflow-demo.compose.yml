# deploy/preview/taskflow-demo.compose.yml
# Coolify dockercompose preview — profile: taskflow-demo
# Build context: repo root (Coolify clones whole repo, build context = clone root)
#
# Domain: set via Coolify API PATCH docker_compose_domains (not SERVICE_FQDN_* env)
# Manifest: generated at build time inside seeder, then written to shared volume
#
# Coolify deployment:
#   build_pack: dockercompose
#   docker_compose_location: /deploy/preview/taskflow-demo.compose.yml
#   git_repository: git@github.com:JasonMMo/compounding-stack-harness.git
#   git_branch: master
#   private_key_uuid: s127pafarr46wlu1r2mre2te
#
# AUTH NOTE: login demo/demo is a stub (no real user DB). In-memory store — all
# data is lost on restart. This is intentional for repeated demo sessions.
# Do NOT store real customer data on this instance.

services:

  backend:
    build:
      context: .
      dockerfile: backend/adapters/fastapi/Dockerfile
    environment:
      PORT: "8081"
      PYTHONIOENCODING: "utf-8"
      # No SEED_FILE — taskflow uses in-memory store seeded via seeder service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/api/status/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  seeder:
    # One-shot: generates the manifest, then seeds 51 records into backend.
    # Restarts with backend on each Coolify redeploy → fresh demo data every time.
    build:
      context: .
      dockerfile: scripts/taskflow-seeder/Dockerfile
    environment:
      PYTHONIOENCODING: "utf-8"
      BACKEND_BASE_URL: "http://backend:8081"
      PROFILE_SLUG: "taskflow-demo"
      MANIFEST_OUT: "/data/manifest/screen-manifest.json"
    volumes:
      - taskflow_manifest:/data/manifest
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: frontend/adapters/vanilla-htmx/Dockerfile
      args:
        UI_THEME: saas
    environment:
      FRONTEND_PORT: "5000"
      BACKEND_BASE_URL: "http://backend:8081"
      CONTRACT_DIR: "/app/middle/contract"
      PROFILE_MANIFEST: "/data/manifest/screen-manifest.json"
      PYTHONIOENCODING: "utf-8"
      # SECRET_KEY injected via Coolify environment variables (not in compose file)
    volumes:
      - taskflow_manifest:/data/manifest:ro
    ports:
      - "5000"
    depends_on:
      backend:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  taskflow_manifest:
    # Shared ephemeral volume: seeder writes manifest, frontend reads it.
    # Volume is local to this Coolify stack — no host bind-mount needed.
    # Data lost on stack removal (acceptable: manifest is regenerated on every deploy).
