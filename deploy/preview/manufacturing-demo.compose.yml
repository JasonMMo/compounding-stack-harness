# deploy/preview/manufacturing-demo.compose.yml
# Coolify dockercompose preview -- profile: manufacturing-demo
# Build context: repo root (Coolify clones whole repo, build context = clone root)
#
# Domain: https://manufacturing-demo.n9n.co.kr (set via Coolify API PATCH docker_compose_domains)

services:

  backend:
    build:
      context: .
      dockerfile: backend/adapters/fastapi/Dockerfile
    environment:
      PORT: "8081"
      PYTHONIOENCODING: "utf-8"
      SEED_FILE: "/app/seed-data/manufacturing-demo.json"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/adapters/vanilla-htmx/Dockerfile
      args:
        UI_THEME: saas
    environment:
      FRONTEND_PORT: "5000"
      BACKEND_BASE_URL: "http://backend:8081"
      CONTRACT_DIR: "/app/middle/contract"
      PROFILE_MANIFEST: "/data/manifest/screen-manifest.json"
      PYTHONIOENCODING: "utf-8"
      # SECRET_KEY injected via Coolify environment variables (not in compose file)
    volumes:
      - type: bind
        source: /data/coolify/manifests/manufacturing-demo/screen-manifest.json
        target: /data/manifest/screen-manifest.json
        read_only: true
    ports:
      - "5000"
    depends_on:
      - backend
    restart: unless-stopped
