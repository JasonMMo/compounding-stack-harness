# presets/industry-defaults.yaml
# AUTO-SYNC: derived from profiles/*-demo.yaml; update in the SAME commit as the source demo.
#
# 목적: IT 지식 없는 의뢰인이 stack/dialect/domains를 미지정(unknown/blank)으로 제출해도
#       intake_to_profile.py 가 industry별 합리적 기본값을 주입할 수 있도록 한다.
#
# 필드:
#   frontend : FRONTEND_MAP 에 존재하는 값 (react/vue/vanilla-htmx/nexacro)
#   backend  : BACKEND_MAP 에 존재하는 값 (springboot/fastapi/node-express/go-chi)
#   dialect  : DIALECT_MAP 에 존재하는 값 (postgres/mysql/oracle/hsqldb)
#   domains  : DOMAIN_ENTITY_MAP 에 존재하는 키 리스트
#              (customer/order/inventory/hr/hr_leave/approval/asset/finance_ledger/document/report)
#   source   : 기준 demo profile 파일명 (또는 "generic-default")
#
# 동기화 규약: profiles/*-demo.yaml 변경 시 이 파일도 같은 커밋에서 갱신한다.

manufacturing:
  frontend: vanilla-htmx
  backend: fastapi
  dialect: postgres
  domains:
    - inventory
    - hr
    - report
  source: manufacturing-demo.yaml

