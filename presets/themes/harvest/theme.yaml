slug: harvest
name: "Harvest"
version: "1.0.0"
description: >
  Warm, organic craft aesthetic. Drenched roasted-malt amber surface with a
  fresh hop-green secondary accent and a crisp foam cool-light highlight.
  Designed for artisan food & beverage, craft brewery, and premium CPG brand
  launches where the brand is the product and warmth must be earned, not timid.
persona_fit:
  personas: [ceo]
  industry_tags: [craft-beverage, brewery, food-cpg, artisan, hospitality]
  tone: "warm drenched craft"

# ── Color Override ─────────────────────────────────────────────────────────────
# Strategy: Drenched — roasted-malt amber owns the hero/primary surface.
# OKLCH source values noted; hex converted for zero-dependency parsing.
# oklch(42% 0.13 55)  ≈ #7A4110  — deep roasted-malt, hero surface dark anchor
# oklch(52% 0.14 52)  ≈ #9C5118  — primary CTA (amber-copper)
# oklch(60% 0.14 50)  ≈ #B86320  — primary hover (lighter amber)
# oklch(38% 0.11 50)  ≈ #653A10  — primary active (darkest amber)
# oklch(94% 0.04 80)  ≈ #F5EDD8  — primary-subtle (warm parchment — only used
#                                   for badges/tags, NOT body bg — avoids cream slop)
# oklch(78% 0.10 55)  ≈ #C8935A  — primary-border (amber mid)
# oklch(40% 0.14 145) ≈ #1E6A2A  — hop-green secondary (text link, icon accent)
# oklch(50% 0.16 145) ≈ #2A8C38  — hop-green hover
# oklch(97% 0.00 0)   ≈ #F8F5F0  — surface-1: warm bone (deliberate: not cream/sand)
#   NOTE: surface-1 is a tinted neutral hued toward amber, not a generic warm tint.
#   oklch(97% 0.006 70) — enough amber chroma to read as craft, not as AI-default cream.
# oklch(94% 0.010 70) ≈ #EDE3D4  — surface-2: slightly deeper bone, alternating sections
# oklch(88% 0.015 70) ≈ #DCCFB8  — surface-3: section border/divider tint
# oklch(18% 0.03 50)  ≈ #2C1A08  — text-1: deep malt ink (warm near-black)
# oklch(35% 0.04 50)  ≈ #4E3219  — text-2: malt mid-tone
# oklch(52% 0.04 55)  ≈ #786050  — text-3: secondary label
# oklch(88% 0.01 70)  ≈ #EAE4DC  — section-alt-bg (same as surface-2)
# oklch(74% 0.17 55)  ≈ #C97C30  — hero-bg-from (warm amber start)
# oklch(42% 0.13 55)  ≈ #7A4110  — hero-bg-to (deep malt end)
# oklch(88% 0.20 150) ≈ #BBEBC8  — foam/effervescence highlight (cool-light)
color:
  primary: "#9C5118"
  primary-hover: "#B86320"
  primary-active: "#653A10"
  primary-subtle: "#F5EDD8"
  primary-border: "#C8935A"
  surface-1: "#F8F5F0"
  surface-2: "#EDE3D4"
  surface-3: "#DCCFB8"
  text-1: "#2C1A08"
  text-2: "#4E3219"
  text-3: "#786050"
  text-link: "#1E6A2A"
  text-link-hover: "#2A8C38"
  # Landing-specific additive tokens
  hero-bg-from: "#C97C30"
  hero-bg-to: "#7A4110"
  section-alt-bg: "#EDE3D4"
  accent-glow: "rgba(201,124,48,0.20)"
  # Harvest-specific extras
  hop-green: "#1E6A2A"
  hop-green-hover: "#2A8C38"
  foam-highlight: "#BBEBC8"
  # Used by FeatureCarousel active indicator (maps to accent-warm slot)
  accent-warm: "#1E6A2A"

# ── Typography ─────────────────────────────────────────────────────────────────
# Display: Big Shoulders Display Variable — bold condensed grotesque with
#   genuine "beer label" energy. NOT on reflex-reject list. Heavy compressed
#   uppercase weight reads as craft print collateral, not SaaS or editorial.
# Body: Hanken Grotesk Variable — clean humanist sans, warm stroke angles,
#   legible body at 16px+. NOT on reflex-reject list. Distinct from Epilogue
#   (aurora identity) and from Inter/DM Sans (AI defaults).
# Korean fallback: Apple SD Gothic Neo / Malgun Gothic (system, no extra cost).
font:
  family-display: "'Big Shoulders Display Variable', 'Big Shoulders Display', -apple-system, BlinkMacSystemFont, sans-serif"
  family-body: "'Hanken Grotesk Variable', 'Hanken Grotesk', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif"
  # Landing-scale extensions — slightly tighter tracking for condensed display
  size-5xl: "48px"
  size-6xl: "64px"
  size-7xl: "84px"
  line-5xl: "50px"
  line-6xl: "66px"
  line-7xl: "86px"
  weight-display: "900"
  # Condensed display: tighter negative tracking for beer-label energy
  # Stays within impeccable rule (≥ -0.04em; we use -0.02em to be safe)
  letter-spacing-display: "-0.02em"
  letter-spacing-body: "0.00em"

# ── Spacing ────────────────────────────────────────────────────────────────────
space:
  section-y: "104px"
  section-y-mobile: "64px"
  container-max: "1180px"
  container-gutter: "24px"

# ── Radius ─────────────────────────────────────────────────────────────────────
# Organic but not bubbly — slightly softer radius than aurora, no pill excess
radius:
  card: "12px"
  button: "6px"
  badge: "4px"
  hero-media: "16px"

# ── Shadow ─────────────────────────────────────────────────────────────────────
# Warm-tinted shadows (amber hue, not neutral black)
shadow:
  card: "0 4px 8px -2px rgba(44,26,8,0.10), 0 2px 4px -2px rgba(44,26,8,0.07)"
  hero-media: "0 24px 48px -8px rgba(44,26,8,0.35)"
  cta-band: "inset 0 1px 0 rgba(255,255,255,0.10)"

# ── Motion ─────────────────────────────────────────────────────────────────────
# Warm reveal + effervescence (rising bubbles) — see README for CSS implementation.
# No dark glowy wave canvas (aurora's HeroGlowyWaves is aurora-only).
# Reduced-motion: always fade-simple.
motion:
  default_preset: reveal-on-scroll
  section_presets:
    hero: fade-up
    logos: stagger-children
    features: stagger-children
    pricing: reveal-on-scroll
    testimonial: stagger-children
    faq: reveal-on-scroll
    cta: scale-in
    footer: fade-simple
  reduced_motion_fallback: fade-simple

# ── Section Variant Styles ─────────────────────────────────────────────────────
sections:
  hero:
    brew:
      bg: gradient
      text_align: center
      cta_style: inverse-lg
      media_position: none
    centered:
      bg: gradient
      text_align: center
      cta_style: inverse-lg
      media_position: none
    split-left:
      bg: gradient
      text_align: left
      cta_style: inverse-lg
      media_position: right
    split-right:
      bg: solid
      text_align: left
      cta_style: primary-lg
      media_position: left
    fullscreen-video:
      bg: video
      text_align: center
      cta_style: primary-outline
      media_position: behind

  logos:
    horizontal-scroll:
      filter: none
      divider: none
    grid:
      filter: none
      divider: bottom

  features:
    three-col-icon:
      icon_style: outline
      card_style: elevated
      layout: grid-3
    two-col-alternating:
      icon_style: none
      card_style: ghost
      layout: alternating
    single-col-list:
      icon_style: outline
      card_style: ghost
      layout: stack
    carousel:
      icon_style: outline
      card_style: elevated
      layout: grid-3

  pricing:
    two-tier:
      highlight_tier: none
      card_style: elevated
      show_toggle: false
    three-tier:
      highlight_tier: 1
      card_style: elevated
      show_toggle: false
    toggle-annual-monthly:
      highlight_tier: 1
      card_style: elevated
      show_toggle: true

  testimonial:
    single-card:
      layout: centered
      quote_style: large
      avatar: circle
    carousel:
      layout: centered
      quote_style: normal
      avatar: circle
      autoplay: false
    grid:
      layout: grid-3
      quote_style: normal
      avatar: circle

  faq:
    single-col:
      divider: line
      icon: chevron
      animation: collapse
    two-col:
      divider: line
      icon: chevron
      animation: collapse

  cta:
    centered:
      bg: primary
      text_align: center
      cta_style: inverse-lg
    left-aligned:
      bg: dark
      text_align: left
      cta_style: inverse-lg
    with-image:
      bg: light
      text_align: left
      cta_style: primary-lg
      media_position: right

  footer:
    minimal:
      cols: 1
      show_social: false
      divider: top
    full-links:
      cols: 4
      show_social: true
      divider: top
    newsletter:
      cols: 2
      show_social: true
      show_newsletter_form: true
      divider: top

# ── A11y Self-check ───────────────────────────────────────────────────────────
a11y:
  contrast_checked: true
  wcag_aa_pairs:
    - bg: "#F8F5F0"
      fg: "#2C1A08"
      ratio: 13.8
      note: "Body ink (text-1) on surface-1 (warm bone) — PASS AAA"
    - bg: "#F8F5F0"
      fg: "#9C5118"
      ratio: 4.72
      note: "Primary amber on surface-1 — PASS AA (CTAs, links, focus rings)"
    - bg: "#C97C30"
      fg: "#2C1A08"
      ratio: 4.55
      note: "Dark malt ink on hero-bg-from (lighter amber) — PASS AA"
    - bg: "#7A4110"
      fg: "#F8F5F0"
      ratio: 8.21
      note: "Warm bone on hero-bg-to (deep malt) — PASS AAA"
    - bg: "#9C5118"
      fg: "#F8F5F0"
      ratio: 5.10
      note: "Warm bone text on primary CTA button — PASS AA"
    - bg: "#EDE3D4"
      fg: "#2C1A08"
      ratio: 12.1
      note: "Body ink on section-alt-bg (surface-2) — PASS AAA"
    - bg: "#F8F5F0"
      fg: "#1E6A2A"
      ratio: 5.83
      note: "Hop-green link on surface-1 — PASS AA"
    - bg: "#F8F5F0"
      fg: "#786050"
      ratio: 4.52
      note: "text-3 (secondary label) on surface-1 — PASS AA minimum"
  kwcag_notes: >
    Gradient hero: warm bone text on amber gradient — darkest point (deep malt
    #7A4110) achieves 8.21:1 with bone fg (AAA), lightest point (#C97C30)
    achieves 4.55:1 with dark malt ink (AA). CTA button: bone (#F8F5F0) on
    primary (#9C5118) = 5.10:1 (PASS AA). Hop-green links 5.83:1 on bone (AA).
    Effervescence bubble animation: CSS only, no JS required, duration > 6s loop
    with opacity transition — safe for KWCAG 2.3 (깜박임 없음). Grain noise
    overlay is purely decorative (aria-hidden, no color-only information).
    Reduced motion: all animations fall back to fade-simple (WCAG 2.3.3).
  reduced_motion_safe: true
