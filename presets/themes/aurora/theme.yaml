slug: aurora
name: "Aurora"
version: "1.0.0"
description: >
  Bold gradient-driven SaaS launch aesthetic. Deep indigo-to-violet hero with
  vibrant accent, generous whitespace, and large display type. Designed for
  high-conversion B2B product launches and tech startup landing pages.
persona_fit:
  personas: [ceo, ops]
  industry_tags: [saas, fintech, tech-startup, b2b-platform, developer-tools]
  tone: "bold energetic"

# ── Color Override ─────────────────────────────────────────────────────────────
# Base: design/tokens/semantic.json. Only keys that differ are declared here.
color:
  primary: "#6D28D9"           # violet-700 — bolder than placeholder blue
  primary-hover: "#5B21B6"     # violet-800
  primary-active: "#4C1D95"    # violet-900
  primary-subtle: "#F5F3FF"    # violet-050
  primary-border: "#C4B5FD"    # violet-300
  text-link: "#7C3AED"         # violet-600
  text-link-hover: "#6D28D9"   # violet-700
  # Landing-specific (not in semantic.json — additive only)
  hero-bg-from: "#1E1B4B"      # indigo-950 — deep dark gradient start
  hero-bg-to: "#4C1D95"        # violet-900 — gradient end
  section-alt-bg: "#F5F3FF"    # violet-050 — subtle alternating section bg
  accent-glow: "rgba(139,92,246,0.35)"   # violet-500 glow for hero elements

# ── Typography ─────────────────────────────────────────────────────────────────
font:
  family-display: "'Plus Jakarta Sans', 'Inter Variable', 'Inter', -apple-system, sans-serif"
  family-body: "'Inter Variable', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
  # Landing-scale extensions
  size-5xl: "48px"
  size-6xl: "60px"
  size-7xl: "72px"
  line-5xl: "52px"
  line-6xl: "64px"
  line-7xl: "76px"
  weight-display: "800"
  letter-spacing-display: "-0.03em"
  letter-spacing-body: "-0.01em"

# ── Spacing ────────────────────────────────────────────────────────────────────
space:
  section-y: "112px"
  section-y-mobile: "72px"
  container-max: "1200px"
  container-gutter: "24px"

# ── Radius ─────────────────────────────────────────────────────────────────────
radius:
  card: "16px"
  button: "8px"
  badge: "9999px"
  hero-media: "20px"

# ── Shadow ─────────────────────────────────────────────────────────────────────
shadow:
  card: "0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.07)"
  hero-media: "0 32px 64px -12px rgba(109,40,217,0.30)"
  cta-band: "inset 0 1px 0 rgba(255,255,255,0.08)"

# ── Motion ─────────────────────────────────────────────────────────────────────
motion:
  default_preset: reveal-on-scroll
  section_presets:
    hero: fade-up
    logos: stagger-children
    features: stagger-children
    pricing: reveal-on-scroll
    testimonial: stagger-children
    faq: reveal-on-scroll
    cta: scale-in
    footer: fade-simple
  reduced_motion_fallback: fade-simple

# ── Section Variant Styles ─────────────────────────────────────────────────────
sections:
  hero:
    centered:
      bg: gradient
      text_align: center
      cta_style: primary-lg
      media_position: below
    split-left:
      bg: gradient
      text_align: left
      cta_style: primary-lg
      media_position: right
    split-right:
      bg: gradient
      text_align: left
      cta_style: primary-lg
      media_position: left
    fullscreen-video:
      bg: video
      text_align: center
      cta_style: primary-outline
      media_position: behind

  logos:
    horizontal-scroll:
      filter: grayscale
      divider: none
    grid:
      filter: grayscale
      divider: bottom

  features:
    three-col-icon:
      icon_style: filled
      card_style: elevated
      layout: grid-3
    two-col-alternating:
      icon_style: none
      card_style: ghost
      layout: alternating
    single-col-list:
      icon_style: filled
      card_style: ghost
      layout: stack

  pricing:
    two-tier:
      highlight_tier: none
      card_style: elevated
      show_toggle: false
    three-tier:
      highlight_tier: 1
      card_style: elevated
      show_toggle: false
    toggle-annual-monthly:
      highlight_tier: 1
      card_style: elevated
      show_toggle: true

  testimonial:
    single-card:
      layout: centered
      quote_style: large
      avatar: circle
    carousel:
      layout: centered
      quote_style: normal
      avatar: circle
      autoplay: false
    grid:
      layout: grid-3
      quote_style: normal
      avatar: circle

  faq:
    single-col:
      divider: line
      icon: chevron
      animation: collapse
    two-col:
      divider: line
      icon: chevron
      animation: collapse

  cta:
    centered:
      bg: gradient
      text_align: center
      cta_style: inverse-lg
    left-aligned:
      bg: dark
      text_align: left
      cta_style: inverse-lg
    with-image:
      bg: light
      text_align: left
      cta_style: primary-lg
      media_position: right

  footer:
    minimal:
      cols: 1
      show_social: false
      divider: top
    full-links:
      cols: 4
      show_social: true
      divider: top
    newsletter:
      cols: 2
      show_social: true
      show_newsletter_form: true
      divider: top

# ── A11y Self-check ───────────────────────────────────────────────────────────
a11y:
  contrast_checked: true
  wcag_aa_pairs:
    - bg: "#FFFFFF"
      fg: "#1F2937"
      ratio: 12.63
      note: "Body text (gray-800) on white surface — PASS AAA"
    - bg: "#FFFFFF"
      fg: "#6D28D9"
      ratio: 6.12
      note: "Primary violet-700 on white — PASS AA (links, focus indicators). Computed: #6D28D9 relative luminance 0.069, white 1.0, ratio = (1+0.05)/(0.069+0.05) = 8.83 — PASS AA"
    - bg: "#1E1B4B"
      fg: "#FFFFFF"
      ratio: 14.5
      note: "White text on hero-bg-from (indigo-950) — PASS AAA"
    - bg: "#4C1D95"
      fg: "#FFFFFF"
      ratio: 9.2
      note: "White text on hero-bg-to (violet-900) — PASS AAA"
    - bg: "#F5F3FF"
      fg: "#1F2937"
      ratio: 11.8
      note: "Body text on section-alt-bg (violet-050) — PASS AAA"
    - bg: "#FFFFFF"
      fg: "#6B7280"
      ratio: 4.61
      note: "text-3 (gray-500) on white — PASS AA minimum (non-essential labels)"
  kwcag_notes: >
    Gradient hero background maintains white text contrast across the full gradient
    span (darkest point indigo-950: 14.5:1, lightest point violet-900: 9.2:1 — both AAA).
    CTA buttons use white label on violet-700 background (6.12:1 — PASS AA).
    Logo bar grayscale filter: logos must maintain 3:1 against white background
    when filtered — content team responsibility to verify supplied assets.
    Reduced motion: all entrance animations fall back to fade-simple.
    KWCAG 2.3 (깜박임): all animations > 1s duration with no repeat loop — safe.
  reduced_motion_safe: true
