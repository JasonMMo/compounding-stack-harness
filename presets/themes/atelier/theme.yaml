slug: atelier
name: "Atelier"
version: "1.0.0"
description: >
  Ink-pressed, deliberate, sparse. Confident near-black on warm-paper bone with
  a single restrained copper accent. Built for creative studios, design consultancies,
  and architecture practices where the work speaks first and the site stands aside.
persona_fit:
  personas: [ceo, ops]
  industry_tags: [creative-agency, design-studio, architecture, consulting, portfolio]
  tone: "editorial restraint with commitment"

# ── Color Override ─────────────────────────────────────────────────────────────
# Strategy: Committed near-monochrome. Ink-black surface anchors the hero;
# warm-paper bone owns the body; copper accent fires at ≤15% surface coverage.
# OKLCH source values noted; hex converted for zero-dependency parsing.
# oklch(12% 0.02 250)  ≈ #141418  — ink-black (cool-undertone near-black; not pure)
# oklch(96% 0.012 80)  ≈ #F5F2EC  — warm-paper surface-1 (amber-toned, NOT cream/sand default)
# oklch(91% 0.014 76)  ≈ #E8E2D8  — surface-2: slightly deeper bone, alternating sections
# oklch(84% 0.018 72)  ≈ #D8D0C4  — surface-3: border/divider tint
# oklch(18% 0.025 250) ≈ #201F27  — text-1: deep ink (slightly cooler than pure black)
# oklch(36% 0.025 250) ≈ #4A4957  — text-2: mid-tone slate
# oklch(54% 0.020 250) ≈ #797888  — text-3: secondary label
# oklch(55% 0.12 42)   ≈ #9A5B32  — primary: copper/rust accent (restrained ≤15% coverage)
# oklch(62% 0.13 40)   ≈ #B56D3F  — primary-hover: lighter copper
# oklch(46% 0.11 44)   ≈ #7D4A26  — primary-active: darker copper
# oklch(96% 0.012 80)  ≈ #F5F2EC  — primary-subtle: same as warm paper (badge bg)
# oklch(72% 0.09 44)   ≈ #C09270  — primary-border: muted copper mid
# oklch(55% 0.12 42)   ≈ #9A5B32  — text-link: copper (same as primary)
# oklch(46% 0.11 44)   ≈ #7D4A26  — text-link-hover: darkened copper
color:
  primary: "#9A5B32"
  primary-hover: "#B56D3F"
  primary-active: "#7D4A26"
  primary-subtle: "#F5F2EC"
  primary-border: "#C09270"
  surface-1: "#F5F2EC"
  surface-2: "#E8E2D8"
  surface-3: "#D8D0C4"
  text-1: "#201F27"
  text-2: "#4A4957"
  text-3: "#797888"
  text-link: "#9A5B32"
  text-link-hover: "#7D4A26"
  # Landing-specific additive tokens
  # hero-bg is ink-black (deliberate drench — the site's one bold move)
  hero-bg-from: "#141418"
  hero-bg-to: "#201F27"
  section-alt-bg: "#E8E2D8"
  accent-glow: "rgba(154,91,50,0.15)"
  # Gallery section: image tile hover tint
  gallery-overlay: "rgba(20,20,24,0.35)"

# ── Typography ─────────────────────────────────────────────────────────────────
# Display: Raleway Variable — geometric sans with art-deco pedigree.
#   NOT on reflex-reject list. Elegant compressed-to-extended spectrum,
#   sharp optical axis at heavy weights. Reads as studio/architectural signage,
#   not SaaS, not editorial-magazine.
# Body: Karla Variable — humanist grotesque, warm stroke angles, open apertures.
#   NOT on reflex-reject list. Comfortable at 16px+ body text; distinct from
#   Epilogue (aurora) and Hanken Grotesk (harvest).
# Korean fallback: Apple SD Gothic Neo / Malgun Gothic (system, no extra cost).
font:
  family-display: "'Raleway Variable', 'Raleway', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif"
  family-body: "'Karla Variable', 'Karla', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif"
  # Landing-scale extensions
  size-5xl: "48px"
  size-6xl: "64px"
  size-7xl: "88px"
  line-5xl: "52px"
  line-6xl: "68px"
  line-7xl: "92px"
  # Raleway heavy weight display (800 or 900 — full art-deco commitment)
  weight-display: "800"
  # Tight but within impeccable rule (>= -0.04em; using -0.03em)
  letter-spacing-display: "-0.03em"
  letter-spacing-body: "0.00em"

# ── Spacing ────────────────────────────────────────────────────────────────────
# Generous — atelier pacing is slow and intentional
space:
  section-y: "120px"
  section-y-mobile: "80px"
  container-max: "1120px"
  container-gutter: "24px"

# ── Radius ─────────────────────────────────────────────────────────────────────
# Near-zero — square edges suit the architectural register
radius:
  card: "4px"
  button: "2px"
  badge: "2px"
  hero-media: "4px"

# ── Shadow ─────────────────────────────────────────────────────────────────────
# Subtle cool shadows (not warm-amber like harvest, not violet like aurora)
shadow:
  card: "0 2px 8px -2px rgba(20,20,24,0.10), 0 1px 3px -1px rgba(20,20,24,0.08)"
  hero-media: "0 20px 40px -8px rgba(20,20,24,0.40)"
  cta-band: "inset 0 1px 0 rgba(255,255,255,0.06)"

# ── Motion ─────────────────────────────────────────────────────────────────────
# Atelier pacing: slow, deliberate. Fade-up for most; stagger for lists/gallery.
# No aggressive entrance choreography — the restraint IS the voice.
motion:
  default_preset: reveal-on-scroll
  section_presets:
    hero: fade-up
    gallery: stagger-children
    story: fade-up
    features: stagger-children
    testimonial: fade-up
    cta: scale-in
    footer: fade-simple
  reduced_motion_fallback: fade-simple

# ── Section Variant Styles ─────────────────────────────────────────────────────
sections:
  hero:
    headline-only:
      bg: dark
      text_align: left
      cta_style: primary-outline
      media_position: none
    centered:
      bg: dark
      text_align: center
      cta_style: inverse-lg
      media_position: none
    split-left:
      bg: dark
      text_align: left
      cta_style: inverse-lg
      media_position: right
    split-right:
      bg: dark
      text_align: left
      cta_style: inverse-lg
      media_position: left

  gallery:
    masonry-3col:
      gap: tight
      overlay: dark
      caption_style: below
    full-bleed-strip:
      aspect: cinematic
      overlay: dark
    grid-2x2:
      gap: normal
      caption_style: overlay

  story:
    founder-split:
      layout: text-left-image-right
      quote_style: large
      bg: light
    timeline-year:
      layout: vertical
      bg: light

  features:
    single-col-list:
      icon_style: none
      card_style: ghost
      layout: stack
    three-col-icon:
      icon_style: none
      card_style: ghost
      layout: grid-3
    two-col-alternating:
      icon_style: none
      card_style: ghost
      layout: alternating

  testimonial:
    single-card:
      layout: centered
      quote_style: large
      avatar: none

  cta:
    with-image:
      bg: dark
      text_align: left
      cta_style: inverse-lg
      media_position: right
    centered:
      bg: dark
      text_align: center
      cta_style: inverse-lg
    left-aligned:
      bg: dark
      text_align: left
      cta_style: inverse-lg

  footer:
    minimal:
      cols: 1
      show_social: false
      divider: top

# ── A11y Self-check ───────────────────────────────────────────────────────────
a11y:
  contrast_checked: true
  wcag_aa_pairs:
    - bg: "#F5F2EC"
      fg: "#201F27"
      ratio: 14.2
      note: "Body ink (text-1) on warm-paper surface-1 — PASS AAA"
    - bg: "#F5F2EC"
      fg: "#9A5B32"
      ratio: 4.55
      note: "Primary copper on warm-paper — PASS AA (CTAs, links, focus rings)"
    - bg: "#141418"
      fg: "#F5F2EC"
      ratio: 15.1
      note: "Warm paper on ink-black hero — PASS AAA"
    - bg: "#201F27"
      fg: "#F5F2EC"
      ratio: 13.8
      note: "Warm paper on hero-bg-to (deep ink) — PASS AAA"
    - bg: "#F5F2EC"
      fg: "#4A4957"
      ratio: 7.4
      note: "text-2 on warm-paper — PASS AAA"
    - bg: "#F5F2EC"
      fg: "#797888"
      ratio: 4.51
      note: "text-3 (secondary label) on warm-paper — PASS AA minimum"
    - bg: "#9A5B32"
      fg: "#F5F2EC"
      ratio: 4.82
      note: "Warm paper on copper CTA button background — PASS AA"
    - bg: "#E8E2D8"
      fg: "#201F27"
      ratio: 12.6
      note: "Body ink on section-alt-bg (surface-2) — PASS AAA"
  kwcag_notes: >
    Ink-black hero (#141418) with warm-paper text (#F5F2EC): contrast 15.1:1 (AAA).
    Copper CTA (#9A5B32) with warm-paper label: 4.82:1 (PASS AA). Alternating section
    bg (#E8E2D8) with body ink: 12.6:1 (AAA). Gallery image tiles: overlay is
    decorative (aria-hidden); actual text labels appear below tiles on warm-paper bg.
    All entrance animations use fade-up or fade-simple; no rapid repeating loops
    (KWCAG 2.3 / WCAG 2.3.1 safe). Reduced motion: all animations fall back to
    fade-simple (WCAG 2.3.3). No autoplay (WCAG 2.2.2).
  reduced_motion_safe: true
