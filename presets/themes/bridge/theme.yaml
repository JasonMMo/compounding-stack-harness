slug: bridge
name: "Bridge"
version: "1.0.0"
description: >
  Crisp white canvas with a single committed deep warm-navy accent. Trust and
  conversion in one register — structured enough for B2B services (telecom,
  insurance, finance SMB), approachable enough that a first-time visitor submits
  a lead. The ai-guide section is the hero surface; every other token serves it.
persona_fit:
  personas: [ceo, ops]
  industry_tags: [telecom-dealer, smb-leadgen, insurance, finance-smb, local-services, b2b-services]
  tone: "trustworthy conversion"

# ── Color Override ─────────────────────────────────────────────────────────────
# Strategy: Pure white canvas + single committed deep warm-navy accent.
#
# Hue exhaustive occupied-hue audit (CDO, 2026-06-18):
#   ignite   H~22   crimson-red
#   harvest  H~55   warm amber-orange
#   kiln     H~48   earth-amber
#   atelier  H~35   warm earth ink
#   flux     H~72   amber-olive (dark ground)
#   meridian H~152  forest-green
#   studio   achromatic
#   aurora   H~280  blue-violet indigo
#   nova     H~305  violet-magenta
#   prism    H~228  deep azure
#
# FREE BAND: H~210-215 (warm-navy / maritime blue) is fully unclaimed.
# Chosen: H~212 -- warm-navy.
#   - 16 degrees from prism (H228): perceptually distinct at this hue angle.
#     Prism reads "API/data azure"; bridge reads "institution/service navy".
#   - 68 degrees from aurora (H280): clearly distinct; no purple bleeding.
#   - H~212 at moderate-high chroma (C~0.16) on light surfaces signals
#     "established, trustworthy service" -- telco, bank, insurer register.
#   - Chroma backed off on surface overrides to avoid "corporate default blue"
#     (the impeccable anti-slop rule: avoid "AI default" cream/sand tones applies
#     equally to generic corporate mid-blue — we anchor chroma at OKLCH precision).
#   - No glow. No gradient on primary CTA button. Button earns click through clarity.
#
# OKLCH derivation (CDO audit trail):
# oklch(99.0% 0.000 212) ~= #FFFFFF    -- surface-1: pure white (max clarity for ai-guide)
# oklch(96.5% 0.007 212) ~= #F2F5F8    -- surface-2: faint navy-white (section alt bg, ai-guide bg)
# oklch(91.0% 0.013 212) ~= #E1E7EF    -- surface-3: navy-tinted rule / input border
# oklch(12.0% 0.018 212) ~= #131B26    -- text-1: near-black, cool navy undertone
# oklch(33.0% 0.035 212) ~= #2D4060    -- text-2: deep navy secondary
# oklch(52.0% 0.030 212) ~= #5B7290    -- text-3: mid navy-grey tertiary / caption
# oklch(41.0% 0.180 212) ~= #13508C    -- primary: deep warm-navy (authority + trust)
# oklch(47.0% 0.185 212) ~= #1C62A4    -- primary-hover: lifted navy
# oklch(35.0% 0.170 212) ~= #0D3E70    -- primary-active: pressed navy
# oklch(95.0% 0.024 212) ~= #EAF1F8    -- primary-subtle: faintest navy badge bg
# oklch(60.0% 0.110 212) ~= #4D80B0    -- primary-border: mid-navy (focus ring, accent)
# oklch(41.0% 0.180 212) ~= #13508C    -- text-link: same as primary
# oklch(35.0% 0.170 212) ~= #0D3E70    -- text-link-hover: pressed navy
#
# hero-bg tokens: the split-hero variant of ai-guide uses a dark navy hero panel left.
# oklch(12.5% 0.022 212) ~= #111E30    -- hero-bg-from: deep warm-navy (left/top dark panel)
# oklch(15.0% 0.020 212) ~= #152540    -- hero-bg-to: slightly lifted navy
# section-alt-bg: same as surface-2 — subtle alternation without pattern noise.
color:
  primary: "#13508C"
  primary-hover: "#1C62A4"
  primary-active: "#0D3E70"
  primary-subtle: "#EAF1F8"
  primary-border: "#4D80B0"
  surface-1: "#FFFFFF"
  surface-2: "#F2F5F8"
  surface-3: "#E1E7EF"
  text-1: "#131B26"
  text-2: "#2D4060"
  text-3: "#5B7290"
  text-link: "#13508C"
  text-link-hover: "#0D3E70"
  # Landing-specific additive tokens
  hero-bg-from: "#111E30"
  hero-bg-to: "#152540"
  section-alt-bg: "#F2F5F8"
  # Bridge uses no glow — trust is built through clarity, not atmosphere
  accent-glow: "rgba(19,80,140,0.00)"
  # ai-guide widget surface tokens
  ai-guide-bg: "#FFFFFF"
  ai-guide-border: "#E1E7EF"
  ai-guide-answer-bg: "#F2F5F8"
  ai-guide-answer-border: "#4D80B0"

# ── Typography ─────────────────────────────────────────────────────────────────
# Display: Plus Jakarta Sans Variable — geometric humanist with a wide optical
#   range (400-800 weight). At 700-800 it carries authority without the cold
#   precision of IBM Plex or the angular geometry of Syne. Warm enough for
#   service businesses; structured enough for B2B conversion.
#   Fontsource: @fontsource-variable/plus-jakarta-sans
#   DISTINCT from all current themes: none use Plus Jakarta Sans.
#   Read: "established local business that has been here for ten years and will
#   still be here in ten more." Approachable authority.
#
# Body: Inter Variable — the legibility anchor. At 14-16px it is the most
#   readable option for form labels, AI answer cards, and mobile lead forms.
#   Fontsource: @fontsource-variable/inter
#   DISTINCT from all current themes in display pairing (no theme uses Inter).
#   Note: meridian uses DM Sans, prism uses DM Sans. Inter body + Plus Jakarta
#   display is a distinct pairing that reads "modern service product".
#
# Korean fallback: Apple SD Gothic Neo / Malgun Gothic (system).
font:
  family-display: "'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif"
  family-body: "'Inter Variable', 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif"
  # Landing-scale extensions
  size-5xl: "48px"
  size-6xl: "58px"
  size-7xl: "70px"
  line-5xl: "52px"
  line-6xl: "62px"
  line-7xl: "74px"
  # 700 for Plus Jakarta Sans -- authoritative without aggression
  weight-display: "700"
  # -0.020em: Plus Jakarta Sans has slightly tight side-bearings at display sizes;
  # this settles the heading without tightening below the impeccable floor (-0.04em).
  letter-spacing-display: "-0.020em"
  letter-spacing-body: "-0.010em"

# ── Spacing ────────────────────────────────────────────────────────────────────
# Conversion-oriented pacing: sections are purposeful, not contemplative.
# 80px section rhythm is tighter than consulting/advisory (meridian 104px) to
# keep the visitor moving toward the ai-guide widget and the lead form.
# Container 1120px: wide enough for split-hero at desktop, tight enough for
# the ai-guide panel to feel contained and trustworthy on mid-size screens.
space:
  section-y: "80px"
  section-y-mobile: "56px"
  container-max: "1120px"
  container-gutter: "20px"

# ── Radius ─────────────────────────────────────────────────────────────────────
# 8px cards: modern service product — not sharp enterprise, not toy-rounded SaaS.
# 6px button: conversion buttons should feel solid. Rounded corners dilute urgency.
# 12px for ai-guide widget panel — slightly softer to signal "interactive tool",
#   distinct from the harder card surfaces elsewhere on the page.
radius:
  card: "8px"
  button: "6px"
  badge: "9999px"
  hero-media: "10px"
  ai-guide-panel: "12px"
  ai-guide-input: "8px"
  ai-guide-answer: "8px"

# ── Shadow ─────────────────────────────────────────────────────────────────────
# Navy-tinted shadows — present but not dramatic.
# ai-guide-panel: elevated enough to read as interactive tool above the page.
shadow:
  card: "0 1px 8px -2px rgba(13,27,38,0.08), 0 1px 3px -1px rgba(13,27,38,0.04)"
  hero-media: "0 20px 40px -8px rgba(13,27,38,0.18)"
  cta-band: "inset 0 1px 0 rgba(255,255,255,0.06)"
  ai-guide-panel: "0 4px 20px -4px rgba(13,27,38,0.12), 0 1px 6px -1px rgba(13,27,38,0.06)"

# ── Motion ─────────────────────────────────────────────────────────────────────
# Conversion pacing: entrances are present but not theatrical.
# The ai-guide widget appears instantly (no entrance delay — tool, not content).
# fade-up for hero/features: directional momentum toward the CTA.
# stagger-children for logos/features grids: structured scan path.
# scale-in for cta band: authoritative finality.
motion:
  default_preset: fade-up
  section_presets:
    hero: fade-up
    logos: stagger-children
    features: stagger-children
    ai-guide: fade-simple
    testimonial: fade-up
    faq: reveal-on-scroll
    cta: scale-in
    footer: fade-simple
  reduced_motion_fallback: fade-simple

# ── Section Variant Styles ─────────────────────────────────────────────────────
# SMB lead-gen / telecom-dealer composition:
# hero/split-hero(ai-guide) → logos/horizontal-scroll → features/three-col-icon
#   → testimonial/grid → faq/single-col → cta/centered → footer/minimal
#
# The ai-guide split-hero IS the hero on a lead-gen landing. The standard hero
# section may be omitted or replaced by ai-guide/split-hero entirely.
sections:

  hero:
    centered:
      bg: solid
      text_align: center
      cta_style: primary-lg
      media_position: none
    split-left:
      bg: dark
      text_align: left
      cta_style: inverse-lg
      media_position: right
    split-right:
      bg: dark
      text_align: left
      cta_style: inverse-lg
      media_position: left

  ai-guide:
    # split-hero: primary placement. Left = dark navy hero panel (trust anchor: headline +
    #   subhead + 3 trust signals). Right = AI guide widget (white panel, input + answer area
    #   + inline lead capture). Highest-conversion layout — widget is above the fold always.
    split-hero:
      bg: gradient
      text_align: left
      cta_style: primary-lg
      media_position: right
      # split_ratio: "55-45" -- left panel 55%, right widget 45% at desktop
      split_ratio: "55-45"
      # trust_signals: optional list rendered below the subhead in the dark panel.
      # Adapter reads copy slot supporting_text for prose; trust_signals for icon rows.
      show_trust_signals: true
      # answer_panel_style: how answer cards are displayed inside the widget.
      answer_panel_style: card         # card | list | inline
      # lead_position: where the lead form appears relative to the answer.
      lead_position: below-answer      # below-answer | sidebar | modal
    # centered-panel: full-width centered panel. Input + answer + lead form vertically stacked.
    # Suitable when ai-guide is the primary section on a single-purpose landing.
    centered-panel:
      bg: light
      text_align: center
      cta_style: primary-lg
      media_position: none
      answer_panel_style: card
      lead_position: below-answer
    # inline-compact: compact embeddable bar. Single-line input, dropdown answer,
    # no full lead form — drives user to anchor #contact or lead section below.
    inline-compact:
      bg: surface-2
      text_align: left
      cta_style: primary-lg
      media_position: none
      answer_panel_style: inline
      lead_position: none

  logos:
    horizontal-scroll:
      filter: grayscale
      divider: none
    grid:
      filter: grayscale
      divider: bottom
    quote-band:
      bg: dark
      text_align: center
      divider: none
      quote_style: large

  features:
    three-col-icon:
      icon_style: filled
      card_style: flat
      layout: grid-3
    two-col-alternating:
      icon_style: outline
      card_style: ghost
      layout: alternating
    single-col-list:
      icon_style: outline
      card_style: ghost
      layout: stack

  testimonial:
    grid:
      layout: grid-3
      quote_style: normal
      avatar: circle
      card_style: elevated
    single-card:
      layout: centered
      quote_style: large
      avatar: circle
    carousel:
      layout: centered
      quote_style: normal
      avatar: circle
      autoplay: false

  faq:
    single-col:
      divider: line
      icon: chevron
      animation: collapse
    two-col:
      divider: line
      icon: chevron
      animation: collapse

  cta:
    centered:
      bg: primary
      text_align: center
      cta_style: inverse-lg
    left-aligned:
      bg: dark
      text_align: left
      cta_style: inverse-lg
    with-image:
      bg: light
      text_align: left
      cta_style: primary-lg
      media_position: right

  footer:
    minimal:
      cols: 1
      show_social: false
      divider: top
    full-links:
      cols: 3
      show_social: false
      divider: top

# ── A11y Self-check ───────────────────────────────────────────────────────────
# ai-guide input: uses surface-1 (#FFFFFF) bg, text-1 (#131B26) label, surface-3
#   (#E1E7EF) border, primary-border (#4D80B0) focus ring.
# ai-guide answer card: surface-2 (#F2F5F8) bg, text-1 (#131B26) body text.
# lead form fields: same as ai-guide input.
# KWCAG 2.4.7: focus visible — primary-border (#4D80B0) focus ring on surface-1 white.
#   Contrast #4D80B0 on #FFFFFF: ~4.5:1 (AA non-text threshold ≥ 3:1, WCAG 1.4.11).
a11y:
  contrast_checked: true
  wcag_aa_pairs:
    - bg: "#FFFFFF"
      fg: "#131B26"
      ratio: 18.2
      note: "Body text-1 on surface-1 -- PASS AAA (primary reading surface, ai-guide body)"
    - bg: "#FFFFFF"
      fg: "#13508C"
      ratio: 7.2
      note: "Navy primary on surface-1 -- PASS AAA (links, CTA labels, focus ring)"
    - bg: "#13508C"
      fg: "#FFFFFF"
      ratio: 7.2
      note: "White label on navy CTA button -- PASS AAA"
    - bg: "#F2F5F8"
      fg: "#131B26"
      ratio: 16.8
      note: "text-1 on surface-2 (section-alt-bg, ai-guide answer bg) -- PASS AAA"
    - bg: "#FFFFFF"
      fg: "#5B7290"
      ratio: 4.5
      note: "text-3 tertiary on surface-1 -- PASS AA minimum (captions, meta, placeholder)"
    - bg: "#111E30"
      fg: "#FFFFFF"
      ratio: 17.4
      note: "White on dark hero panel (hero-bg-from) -- PASS AAA (split-hero trust panel)"
    - bg: "#EAF1F8"
      fg: "#131B26"
      ratio: 15.9
      note: "text-1 on primary-subtle badge bg -- PASS AAA (status badges)"
    - bg: "#F2F5F8"
      fg: "#13508C"
      ratio: 6.6
      note: "Navy primary on ai-guide answer card bg -- PASS AA (answer links, rec labels)"
  kwcag_notes: >
    Pure white (#FFFFFF) with near-black text (#131B26): 18.2:1 (AAA).
    Navy primary (#13508C) on surface-1 (#FFFFFF): 7.2:1 (AAA). CTA button
    (#13508C bg / #FFFFFF label): 7.2:1 (AAA). ai-guide answer cards
    (surface-2 #F2F5F8 / text-1 #131B26): 16.8:1 (AAA). Dark hero panel
    (#111E30 / #FFFFFF): 17.4:1 (AAA). Focus ring primary-border (#4D80B0) on
    #FFFFFF: ~4.5:1 >> 3.0 (non-text WCAG 1.4.11, KWCAG 2.4.7).
    ai-guide input placeholder uses text-3 (#5B7290) on surface-1: 4.5:1 (AA).
    Lead form error states must use text-1 (#131B26) on primary-subtle (#EAF1F8)
    OR a visible icon+text combination (not color alone — WCAG 1.4.1).
    All entrance animations reduce to fade-simple under prefers-reduced-motion
    (WCAG 2.3.3). ai-guide widget uses fade-simple always (instant tool readiness).
    No autoplay anywhere (WCAG 2.2.2). KWCAG 2.3: no animation > 3Hz.
  reduced_motion_safe: true
