version: "1.0"
# Site-Sections Catalog — 13 section types for marketing-site deliverables.
# (Growth-78 adds process + team for A6 B2B services archetype; stats is backlog #2, not yet added)
# Dialect-neutral; site_manifest.py validates profile site.pages[].sections[] against this.
# Pattern: presets/ddl/catalog.yaml (machine truth, format: presets/site-sections/_catalog-format.md)
#
# copy_slots:  content slots the CMO/author must fill (headline, subhead, etc.)
# asset_slots: image/video asset refs expected per section instance
# item_slots:  schema for the section's repeated items[] entries (distinct from copy_slots, which are singular)
# variants:    visual layout variants a theme may implement

sections:

  hero:
    label: "Hero Banner"
    copy_slots:
      required: [headline, subhead]
      optional: [supporting_text]
    asset_slots: [bg_image]
    # glowy-waves: animated canvas hero with React island (framer-motion).
    # Required: headline, subhead, cta. Optional: pills (string[]), stats ({label,value}[]).
    # brew: warm-organic hero — CSS grain noise + effervescence bubbles (harvest theme).
    # No JS required. Reduced-motion safe (bubbles static). No dark canvas.
    # headline-only: typographic display hero — no imagery, one massive heading,
    #   one sub-line, one CTA. Type IS the design. A2 archetype (creative agency/portfolio).
    variants: [centered, split-left, split-right, fullscreen-video, glowy-waves, brew, headline-only]

  logos:
    label: "Logo Bar / Social Proof"
    copy_slots:
      required: [eyebrow]
      optional: [heading, subhead, quote, author_name, author_title, company]
    asset_slots: [logo_1, logo_2, logo_3, logo_4, logo_5, logo_6]
    # marquee-3d: 3D perspective proof wall — React island (framer-motion).
    # Required copy: eyebrow (kept for catalog invariant; may be empty string).
    # Optional copy: heading, subhead.
    # images: required list of image paths (string[]) for this variant — threaded
    #   through site_manifest.py and manifest.ts; validated at profile level.
    # Other variants (horizontal-scroll, grid) use asset_slots; marquee-3d uses images[].
    # quote-band: single full-width customer quote + author attribution + one brand logo.
    #   Replaces the logo grid with a single credible client voice. Uses copy slots:
    #   quote (required for this variant), author_name, author_title, company.
    #   eyebrow may be empty string (catalog invariant). logo_1 serves as the single brand logo.
    #   Structural alternative to logo-soup for B2B / consulting register (A6 archetype).
    variants: [horizontal-scroll, grid, marquee-3d, quote-band]

  features:
    label: "Feature List"
    copy_slots:
      required: [headline]
      optional: [subhead]
    asset_slots: [feature_image]
    item_slots:
      required: [title, description]
      optional: [icon, image]
    # bento-mosaic: irregular CSS grid — one large feature card spans 2 rows, rest smaller.
    # Breaks card-grid sameness via layout structure (not via color variation per card).
    # A1 SaaS Product Launch archetype. No JS required. icon_style: none by default in flux theme.
    variants: [three-col-icon, two-col-alternating, single-col-list, carousel, bento-mosaic]

  pricing:
    label: "Pricing Table"
    copy_slots:
      required: [headline]
      optional: [subhead, disclaimer]
    asset_slots: []
    variants: [two-tier, three-tier, toggle-annual-monthly]

  testimonial:
    label: "Testimonial / Social Proof"
    copy_slots:
      required: [quote, author_name]
      optional: [author_title, company]
    asset_slots: [author_photo]
    # pull-quote-wall: full-bleed section, 2-3 large pull-quotes in asymmetric column layout.
    # Typographic — no card boxing. Distinct from carousel (one-at-a-time) and grid (equal cards).
    # A1 SaaS Product Launch archetype. No JS required. avatar: none by default.
    variants: [single-card, carousel, grid, pull-quote-wall]
    # variant_overrides (Growth-83, closes P2): pull-quote-wall carries its quotes in items[],
    #   so the section-level copy quote/author_name are redundant and become optional for it.
    variant_overrides:
      pull-quote-wall: { copy_optional: [quote, author_name] }

  faq:
    label: "FAQ Accordion"
    copy_slots:
      required: [headline]
      optional: [subhead]
    asset_slots: []
    item_slots:
      required: [question, answer]
    variants: [single-col, two-col]

  cta:
    label: "Call-to-Action Band"
    copy_slots:
      required: [headline]
      optional: [subhead, sub_copy, button_label, placeholder, legal_copy, demo_stub_message, secondary_label, secondary_href]
    asset_slots: []
    # centered: primary cta (props.cta). Optional SECOND button via copy.secondary_label +
    #   copy.secondary_href — renders a button pair (e.g. iOS / Android download). A5 Mobile App.
    #   Text buttons, not trademarked store badges (photo-free + trademark-safe).
    # newsletter-inline: email input + submit inline in dark band. A3 Event archetype.
    # copy_slots for newsletter-inline: headline, sub_copy, button_label, placeholder,
    #   legal_copy, demo_stub_message. No asset_slots required.
    variants: [centered, left-aligned, with-image, newsletter-inline]

  lead:
    label: "Lead / Newsletter Capture"
    copy_slots:
      required: [headline]
      optional: [subhead, button_label, success_message, placeholder]
    asset_slots: []
    # minimal-field: single email input + submit, centered, soft ask. Submits via
    #   entity.create(entity_type=lead) — reuses the contact-form wire key (G-1: reads
    #   middle contract, no new key). multi-field-card: name+email+message in a raised card.
    variants: [minimal-field, multi-field-card]

  gallery:
    label: "Gallery / Showcase"
    copy_slots:
      required: [headline]
      optional: [subhead]
    asset_slots: []
    # items[].src: image path. items[].alt: required alt text. items[].caption: optional.
    # parallax-scroll items also support: heading, subheading, body, cta_label, cta_href.
    item_slots:
      required: [src, alt]
      optional: [caption, href, heading, subheading, body, cta_label, cta_href]
    # variant_overrides: per-variant relaxation of normally-required slots (Growth-83, closes P2).
    #   grid-2x2: src omitted → component renders a token-driven CSS app-screen mockup (photo-free).
    #   parallax-scroll: src omitted → component renders a theme material-texture field.
    variant_overrides:
      grid-2x2:        { item_optional: [src] }
      parallax-scroll: { item_optional: [src] }
    # masonry-3col: 3-column CSS masonry of images; heights vary by image AR.
    # full-bleed-strip: single decisive image fills full viewport width, tall aspect.
    # grid-2x2: 2x2 product screenshot grid with optional per-cell caption.
    # parallax-scroll: sticky full-viewport chapter panels; on scroll the panel scales +
    #   a dark overlay fades in, and overlay heading/subheading parallax through; an
    #   editorial body + CTA block follows below each chapter. `src` is OPTIONAL — when
    #   absent, the panel renders a theme material-texture field (CSS gradient+grain, no
    #   image asset), so the variant looks intentional with zero photos. React island
    #   (framer-motion useScroll); MUST render full content statically with no JS
    #   (Growth-69 invariant — images/text visible, just no parallax).
    variants: [masonry-3col, full-bleed-strip, grid-2x2, parallax-scroll]

  story:
    label: "Story / About"
    copy_slots:
      required: [headline]
      optional: [body, pull_quote, subhead]
    asset_slots: [image]
    # item_slots: timeline-year variant uses items[] with year + milestone per entry.
    # detail is optional context text below the milestone. founder-split ignores items.
    # Omitting items[] entirely is valid (timeline-year falls back to copy.body).
    item_slots:
      required: [year, milestone]
      optional: [detail]
    # founder-split: two-column — heading + prose left, typographic/quote block or
    #   single image right. No fabricated founder photo required; type fills the split.
    # timeline-year: vertical timeline with year markers and short milestone text.
    variants: [founder-split, timeline-year]

  process:
    label: "How-It-Works / Process"
    copy_slots:
      required: [headline]
      optional: [subhead]
    asset_slots: []
    item_slots:
      required: [title]
      optional: [description, step_label]
    # step_label optional: numbering is positional by default (step 1, 2, 3…).
    # numbered-stack: vertical numbered steps; each step headline + one-line description.
    # horizontal-steps: left-to-right steps with connectors; collapses to stack on mobile.
    # split-animation: step number locks left, right column scrolls through step content (React island).
    variants: [numbered-stack, horizontal-steps, split-animation]

  stats:
    label: "Stats / Metrics Band"
    copy_slots:
      required: []
      optional: [headline, subhead]
    asset_slots: []
    # item_slots: each stat is a value (large number/percentage/string) + label (descriptor).
    # ticker-band: full-width band, stats inline, subtle separator, no card boxing.
    # four-up: 4 stats in a grid row; large number + small label per cell (A3 Event, A5 Mobile).
    item_slots:
      required: [value, label]
    variants: [ticker-band, four-up]

  team:
    label: "Team / People"
    copy_slots:
      required: [headline]
      optional: [subhead]
    asset_slots: []
    item_slots:
      required: [name, role]
      optional: [bio, photo]
    # photo OPTIONAL — when absent the component renders a monogram-initials avatar
    #   (initials-in-a-circle; no fabricated stock faces).
    # headshot-grid: 3-4 column grid of avatar + name + role.
    # headshot-list: horizontal cards; avatar + name + two-line bio.
    variants: [headshot-grid, headshot-list]

  footer:
    label: "Footer"
    copy_slots:
      required: [brand_name]
      optional: [tagline, legal_notice]
    asset_slots: [logo]
    variants: [minimal, full-links, newsletter]
