                      fk: { entity: approval-step, column: id, on_delete: cascade } }
      employee_id:  { type: uuid,      nullable: false,
                      fk: { entity: employee,      column: id, on_delete: restrict } }
      notified_at:  { type: timestamp, nullable: true }
