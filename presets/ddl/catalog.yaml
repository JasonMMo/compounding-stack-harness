  approval-decision:
    domain: approval
    table: approval_decision
    label_ko: 결재 결정
    primary_key: id
    columns:
      id:          { type: uuid,      nullable: false }
      created_at:  { type: timestamp, nullable: false }
      updated_at:  { type: timestamp, nullable: false }
      step_id:     { type: uuid,      nullable: false,
                     fk: { entity: approval-step, column: id, on_delete: cascade } }
      approver_id: { type: uuid,      nullable: false,
                     fk: { entity: approver,      column: id, on_delete: cascade } }
      decision:    { type: enum,      values: [approved, rejected], nullable: false }
      comment:     { type: string,    nullable: true }
      decided_at:  { type: timestamp, nullable: false }
    constraints:
      - { type: unique, columns: [step_id, approver_id] }
    indexes:
      - { columns: [step_id] }
    # DDL notes:
    #   Immutable once recorded — application layer.

  # ─────────────────────────────────────────────
