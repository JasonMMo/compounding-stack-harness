      code:          { type: string,  length: 64, nullable: false, unique: true }
      name:          { type: string,  nullable: false }
      domain:        { type: string,  length: 32, nullable: false }
      description:   { type: text,    nullable: true }
      output_format: { type: enum,    values: [table, chart, pivot, export-csv, export-xlsx], nullable: false }
      is_active:     { type: boolean, nullable: false }
      owner_id:      { type: uuid,    nullable: false,
                       fk: { entity: employee, column: id, on_delete: restrict } }
    constraints: []
    indexes:
      - { columns: [domain] }
      - { columns: [is_active] }

  report-schedule:
    domain: reporting
    table: reporting_report_schedule
    label_ko: 보고서 일정
    primary_key: id
    columns:
      id:                   { type: uuid,      nullable: false }
      created_at:           { type: timestamp, nullable: false }
      updated_at:           { type: timestamp, nullable: false }
      report_definition_id: { type: uuid,      nullable: false,
                              fk: { entity: report-definition, column: id, on_delete: cascade } }
      cron_expression:      { type: string,    length: 64, nullable: false }
      is_active:            { type: boolean,   nullable: false }
      recipient_ids:        { type: text,      nullable: false }
      next_run_at:          { type: timestamp, nullable: true }
      last_run_at:          { type: timestamp, nullable: true }
    constraints: []
    indexes:
      - { columns: [report_definition_id] }
    # DDL notes:
    #   recipient_ids is a JSON array stored as text (no ARRAY type in neutral vocab);
    #     adapter must parse/serialise. At least one entry — application layer.
    #   cron_expression syntax validation — application layer.

  report-parameter:
    domain: reporting
    table: reporting_report_parameter
    label_ko: 보고서 파라미터
    primary_key: id
    columns:
      id:                   { type: uuid,    nullable: false }
      created_at:           { type: timestamp, nullable: false }
      updated_at:           { type: timestamp, nullable: false }
      report_definition_id: { type: uuid,    nullable: false,
                              fk: { entity: report-definition, column: id, on_delete: cascade } }
      name:                 { type: string,  length: 64, nullable: false }
      label:                { type: string,  nullable: false }
      data_type:            { type: enum,    values: [string, integer, number, boolean, date, enum], nullable: false }
      is_required:          { type: boolean, nullable: false }
      default_value:        { type: string,  nullable: true }
      enum_values:          { type: text,    nullable: true }
    constraints:
      - { type: unique, columns: [report_definition_id, name] }
    indexes:
      - { columns: [report_definition_id] }
    # DDL notes:
    #   enum_values stored as JSON text array; when data_type=enum, non-empty — application layer.

  report-output:
    domain: reporting
    table: reporting_report_output
    label_ko: 보고서 출력
    primary_key: id
    columns:
      id:                   { type: uuid,      nullable: false }
      created_at:           { type: timestamp, nullable: false }
      updated_at:           { type: timestamp, nullable: false }
      report_definition_id: { type: uuid,      nullable: false,
                              fk: { entity: report-definition, column: id, on_delete: restrict } }
      triggered_by:         { type: enum,      values: [manual, schedule], nullable: false }
      # fk-exempt: polymorphic — paired with triggered_by discriminator (manual=employee, schedule=scheduled-job)
      triggered_by_id:      { type: uuid,      nullable: true }
      status:               { type: enum,      values: [queued, running, completed, failed], nullable: false }
      started_at:           { type: timestamp, nullable: true }
      completed_at:         { type: timestamp, nullable: true }
      storage_key:          { type: string,    nullable: true }
      row_count:            { type: integer,   nullable: true }
      error_message:        { type: text,      nullable: true }
    constraints:
      - { type: check, expr: "completed_at IS NULL OR started_at IS NULL OR completed_at >= started_at" }
    indexes:
      - { columns: [report_definition_id] }
      - { columns: [status] }
    # DDL notes:
    #   Append-only once completed/failed — application layer.

  # ─────────────────────────────────────────────
  # LEGAL (법무) — Growth-24, M3 첫 vertical
  # ─────────────────────────────────────────────

  legal-case:
    domain: legal
    table: legal_case
    label_ko: 사건
    primary_key: id
    columns:
      id:                   { type: uuid,      nullable: false }
      created_at:           { type: timestamp, nullable: false }
      updated_at:           { type: timestamp, nullable: false }
      case_number:          { type: string,    length: 64, nullable: false, unique: true }
      title:                { type: string,    nullable: false }
      case_type:            { type: enum,      values: [civil, criminal, administrative, family, commercial], nullable: false }
      status:               { type: enum,      values: [intake, active, trial, appeal, closed, withdrawn], nullable: false }
      filed_date:           { type: date,      nullable: false }
      court:                { type: string,    nullable: true }
      next_hearing_date:    { type: date,      nullable: true }
      assigned_attorney_id: { type: uuid,      nullable: false,
                              fk: { entity: employee, column: id, on_delete: restrict } }
      client_contact_id:    { type: uuid,      nullable: true,
                              fk: { entity: contact, column: id, on_delete: set_null } }
      summary:              { type: text,      nullable: true }
    constraints: []
    indexes:
      - { columns: [status] }
      - { columns: [assigned_attorney_id] }
      - { columns: [next_hearing_date] }
    # DDL notes:
    #   Full-text search over summary — postgres tsvector GIN index; application layer.
    #   closed/withdrawn = terminal states; no re-activation — application layer.
    #   client_contact_id → crm_contact (cross-domain FK); restrict omitted — app layer.

  precedent:
    domain: legal
    table: legal_precedent
    label_ko: 판례
    primary_key: id
    columns:
      id:           { type: uuid,   nullable: false }
      created_at:   { type: timestamp, nullable: false }
      updated_at:   { type: timestamp, nullable: false }
      citation:     { type: string, length: 128, nullable: false, unique: true }
      court:        { type: string, nullable: false }
      decided_date: { type: date,   nullable: false }
      case_type:    { type: enum,   values: [civil, criminal, administrative, family, commercial], nullable: false }
      holding:      { type: text,   nullable: false }
      full_text:    { type: text,   nullable: true }
      keywords:     { type: string, nullable: true }
    constraints: []
    indexes:
      - { columns: [case_type] }
      - { columns: [decided_date] }
    # DDL notes:
    #   Full-text search over holding + keywords — postgres tsvector GIN index; app layer.
    #   RAG vector embedding index — separate vector store, not in this DDL (Growth-24 escalation).
    #   keywords stored as comma-separated string; parsed at application layer.
    #   full_text: public rulings only — copyright check required before storing.

  case-party:
    domain: legal
    table: legal_case_party
    label_ko: 사건 당사자
    primary_key: id
    columns:
      id:         { type: uuid,   nullable: false }
      created_at: { type: timestamp, nullable: false }
      updated_at: { type: timestamp, nullable: false }
      case_id:    { type: uuid,   nullable: false,
                    fk: { entity: legal-case, column: id, on_delete: cascade } }
      role:       { type: enum,   values: [plaintiff, defendant, witness, opposing-counsel, expert-witness], nullable: false }
      name:       { type: string, nullable: false }
      contact_id: { type: uuid,   nullable: true,
                    fk: { entity: contact, column: id, on_delete: set_null } }
      notes:      { type: string, nullable: true }
    constraints: []
    indexes:
      - { columns: [case_id] }
      - { columns: [role] }
    # DDL notes:
    #   Multiple parties per case allowed; same person in multiple roles is valid.
    #   contact_id → crm_contact; FK on_delete=set_null (contact deletion does not remove party record).

  case-document:
    domain: legal
    table: legal_case_document
    label_ko: 사건 서류
    primary_key: id
    columns:
      id:            { type: uuid,      nullable: false }
      created_at:    { type: timestamp, nullable: false }
      updated_at:    { type: timestamp, nullable: false }
      case_id:       { type: uuid,      nullable: false,
                       fk: { entity: legal-case, column: id, on_delete: cascade } }
      document_type: { type: enum,      values: [complaint, brief, evidence, court-order, contract, correspondence, other], nullable: false }
      title:         { type: string,    nullable: false }
      filed_at:      { type: timestamp, nullable: true }
      storage_key:   { type: string,    nullable: true }
      notes:         { type: string,    nullable: true }
      content_text:  { type: text,      nullable: true }
      ingest_status: { type: enum,      values: [pending, processing, done, error], nullable: true }
      ingested_at:   { type: timestamp, nullable: true }
    constraints: []
    indexes:
      - { columns: [case_id] }
      - { columns: [document_type] }
      - { columns: [ingest_status] }
    # DDL notes:
    #   storage_key resolves to document_version.storage_key — cross-domain; FK omitted (app layer).
    #   Append-only for legal audit trail — application layer.
    #   content_text: extracted plain text from PDF/DOCX by ingest pipeline. NULL until processed.
    #   fts_vector (tsvector GENERATED ALWAYS): postgres-specific; in augment DDL, not neutral catalog.
    #   RLS: case-scoped (attorney/partner only). See out/legal-rag-mvp/schema/04_case_document_augment.sql.

  case-deadline:
    # Growth-127 — K1 "기일·기한 가디언". 소형 로펌 killer-app: 변호사 최대 리스크(기일·시효 누락) 추적.
    # 로폼(LawForm) 미커버 사건축. self-host·검색형 차별. wiki: syntheses/lawform-competitive-analysis.
    domain: legal
    table: legal_case_deadline
    label_ko: 기일·기한
    primary_key: id
    columns:
      id:                   { type: uuid,      nullable: false }
      created_at:           { type: timestamp, nullable: false }
      updated_at:           { type: timestamp, nullable: false }
      case_id:              { type: uuid,      nullable: false,
                              fk: { entity: legal-case, column: id, on_delete: cascade } }
      deadline_type:        { type: enum,      values: [court_date, filing, statute_of_limitations, other], nullable: false }
      title:                { type: string,    nullable: false }
      due_date:             { type: date,      nullable: false }
      status:               { type: enum,      values: [pending, done, missed], nullable: false }
      assigned_attorney_id: { type: uuid,      nullable: true,
                              fk: { entity: employee, column: id, on_delete: set_null } }
      notes:                { type: string,    nullable: true }
    constraints: []
    indexes:
      - { columns: [case_id] }
      - { columns: [due_date] }
      - { columns: [status] }
    # DDL notes:
    #   due_date 임박(D-7 이내, status=pending) 행은 프론트가 시각 하이라이트 — application layer.
    #   statute_of_limitations(시효)는 종결 사건이라도 추적 필요 — terminal 사건 상태와 무관.
    #   honest-promise: "기한 누락 100% 방지" 금지 → "등록된 기일의 임박 알림"만 약속.
    #   RLS: case-scoped (담당 변호사·파트너만). augment DDL 09_legal_case_deadline.sql 참조.

  # ─── legal-rag-mvp additions (Growth-48) ────────────────────────────────────

  legal-case-augment:
    # Not a standalone entity — documents the augment columns added to legal-case.
    # physical table: legal_case (merged). Tracked here for catalog drift detection.
    domain: legal
    table: legal_case
    label_ko: 사건 (RAG 보강)
    primary_key: id
    _augment_of: legal-case
    _augment_note: "Growth-48 RAG MVP adds: partner_id, fts_vector (GIN/pg_bigm), RLS policies"
    columns:
      partner_id:   { type: uuid, nullable: true }
      # fts_vector: postgres tsvector GENERATED ALWAYS — not in neutral catalog; dialect-specific
    constraints: []
    indexes:
      - { columns: [partner_id] }
    # DDL notes:
    #   fts_vector: GENERATED ALWAYS AS tsvector (postgres-only). Not rendered by render.py.
    #   GIN index on fts_vector: idx_legal_case_fts. pg_bigm index on title: idx_legal_case_title_bigm.
    #   RLS policies in: out/legal-rag-mvp/schema/02_legal_case_augment.sql

  document-chunk:
    domain: legal
    table: legal_document_chunk
    label_ko: 문서 청크 (RAG)
    primary_key: id
    columns:
      id:              { type: uuid,      nullable: false }
      created_at:      { type: timestamp, nullable: false }
      updated_at:      { type: timestamp, nullable: false }
      source_type:     { type: enum,      values: [precedent, case_document], nullable: false }
      source_id:       { type: uuid,      nullable: false }
      case_id:         { type: uuid,      nullable: true,
                         fk: { entity: legal-case, column: id, on_delete: cascade } }
      chunk_index:     { type: integer,   nullable: false }
      chunk_text:      { type: text,      nullable: false }
      token_count:     { type: integer,   nullable: true }
      embedded_at:     { type: timestamp, nullable: true }
      model_version:   { type: string,    length: 64, nullable: true }
      # embedding (vector(768)): pgvector extension type — not in neutral catalog type vocab.
      # Tracked as metadata; actual DDL in out/legal-rag-mvp/schema/06_legal_document_chunk.sql.
    constraints:
      - { type: unique, columns: [source_id, source_type, chunk_index] }
    indexes:
      - { columns: [source_type, source_id] }
      - { columns: [case_id] }
      - { name: idx_legal_chunk_fts,  type: gin, expression: "to_tsvector('simple', chunk_text)",
          note: "tsquery-OR fallback — always active, no extension required" }
      - { name: idx_legal_chunk_hnsw, type: hnsw, columns: [embedding],
          ops: vector_cosine_ops, partial: "embedding IS NOT NULL",
          note: "pgvector HNSW cosine ANN" }
      - { name: idx_legal_chunk_bigm, type: gin, columns: [chunk_text],
          ops: gin_bigm_ops, extension_guard: pg_bigm,
          note: "Korean bigram FTS — created only when pg_bigm extension is present" }
    # DDL notes:
    #   source_id is polymorphic FK: resolves to legal_precedent.id OR legal_case_document.id
    #     based on source_type. FK omitted (app layer).
    #   embedding vector(768): pgvector-specific column; added via augment DDL.
    #   idx_legal_chunk_bigm: guarded by DO block in 06_legal_document_chunk.sql —
    #     skipped silently when pg_bigm absent; active when custom image (DevOps Growth-?) ships.
    #   RLS: precedent chunks = all app_users; case_document chunks = case attorney/partner only.
    #   Citation anchor: chunk.id binds RAG answers to verifiable source records.

  legal-attorney:
    domain: legal
    table: legal_attorney
    label_ko: 변호사 계정
    primary_key: id
    columns:
      id:            { type: uuid,      nullable: false }
      created_at:    { type: timestamp, nullable: false }
      updated_at:    { type: timestamp, nullable: false }
      email:         { type: string,    nullable: false, unique: true }
      password_hash: { type: string,    nullable: false }
      display_name:  { type: string,    nullable: false }
      partner_id:    { type: uuid,      nullable: true,
                       fk: { entity: legal-attorney, column: id, on_delete: set_null } }
      role:          { type: enum,      values: [attorney, partner], nullable: false }
      is_active:     { type: boolean,   nullable: false }
    constraints:
      - { type: check, expression: "role IN ('attorney', 'partner')" }
    indexes:
      - { columns: [partner_id] }
      - { columns: [is_active] }
    # DDL notes:
    #   password_hash: bcrypt $2b$ cost>=12 only. Plain-text storage forbidden.
    #   partner_id: self-referencing FK (DEFERRABLE INITIALLY DEFERRED — postgres-specific).
    #   RLS (postgres-only): app_user SELECT = own row OR subordinate attorneys (partner_id = current_user_id).
    #     INSERT/UPDATE/DELETE: app_service (BYPASSRLS) only — no self-registration.
    #   FK from legal_case.assigned_attorney_id / partner_id → legal_attorney(id): added in 08_legal_attorney.sql.
    #   Seed load order: seed_attorneys.sql BEFORE seed_cases.sql (FK dependency).

  rag-query-log:
    domain: legal
    table: legal_rag_query_log
    label_ko: RAG 질의 로그
    primary_key: id
    columns:
      id:                   { type: uuid,      nullable: false }
      created_at:           { type: timestamp, nullable: false }
      updated_at:           { type: timestamp, nullable: false }
      attorney_id:          { type: uuid,      nullable: false }
      case_id:              { type: uuid,      nullable: true,
                              fk: { entity: legal-case, column: id, on_delete: set_null } }
      query_text:           { type: text,      nullable: false }
      retrieved_chunk_ids:  { type: text,      nullable: true }
      citations_summary:    { type: text,      nullable: true }
      answer_text:          { type: text,      nullable: true }
      model_id:             { type: string,    length: 64, nullable: true }
      tokens_used:          { type: integer,   nullable: true }
      latency_ms:           { type: integer,   nullable: true }
      status:               { type: enum,      values: [pending, completed, error], nullable: false }
      error_message:        { type: text,      nullable: true }
      # query_embedding (vector(768)): pgvector-specific; optional analytics field.
    constraints: []
    indexes:
      - { columns: [attorney_id, created_at] }
      - { columns: [case_id, created_at] }
      - { columns: [status] }
    # DDL notes:
    #   attorney_id → hr_employee (cross-domain FK; enforced at application layer).
    #   retrieved_chunk_ids: JSON array text of legal_document_chunk.id UUIDs.
    #   Append-only audit log — no UPDATE/DELETE for app_user (RLS enforced).
    #   query_embedding: pgvector column for query analytics; added via augment DDL.

  # ─── K3 타임시트·빌링 killer-app (Growth K3) ────────────────────────────────

  time-entry:
    # Growth K3 — K3 "타임시트·빌링 killer-app". 변호사별 업무 시간 기록 → 청구 합계 집계.
    # honest: "자동 청구서 생성·법적 효력" 주장 금지 — "기록 기반 청구 합계 집계"만 약속.
    domain: legal
    table: legal_time_entry
    label_ko: 타임시트
    primary_key: id
    columns:
      id:           { type: uuid,      nullable: false }
      created_at:   { type: timestamp, nullable: false }
      updated_at:   { type: timestamp, nullable: false }
      case_id:      { type: uuid,      nullable: false,
                      fk: { entity: legal-case, column: id, on_delete: cascade } }
      employee_id:  { type: uuid,      nullable: false,
                      fk: { entity: employee,   column: id, on_delete: restrict } }
      work_date:    { type: date,      nullable: false }
      minutes:      { type: integer,   nullable: false }
      description:  { type: string,    nullable: false }
      billable:     { type: boolean,   nullable: false }
      hourly_rate:  { type: integer,   nullable: false }
      amount:       { type: integer,   nullable: false }
      status:       { type: enum,      values: [draft, submitted, billed], nullable: false }
    constraints: []
    indexes:
      - { columns: [case_id] }
      - { columns: [employee_id] }
      - { columns: [status] }
    # DDL notes:
    #   minutes: 분 단위 정수. float 금지 — 정수 분 단위 집계로 반올림 오류 방지.
    #   hourly_rate: KRW/시간 스냅샷. 기록 시점 단가 고정 (이후 변경 무관).
    #   amount: KRW = round(minutes/60*hourly_rate). 저장 시 계산, 이후 불변.
    #   RLS: case-scoped (담당 변호사·파트너만). augment DDL 12_legal_time_entry.sql 참조.
    #   K3 killer 기능: time-entry 목록 화면에서 billable_total/unbilled_total/total_minutes 롤업 배너.

  case-invoice:
    # Growth K3 — K3 "타임시트·빌링 killer-app". 사건별 청구서.
    # 키: case-invoice (legal 도메인 관습 — case-party/case-deadline/case-document 패턴).
    # finance 도메인의 invoice(finance_invoice)와 YAML 키 충돌 방지.
    # honest: "법적 효력 청구서" 주장 금지 — "기록 기반 청구 합계 집계"만 약속.
    domain: legal
    table: legal_invoice
    label_ko: 청구서
    primary_key: id
    columns:
      id:           { type: uuid,      nullable: false }
      created_at:   { type: timestamp, nullable: false }
      updated_at:   { type: timestamp, nullable: false }
      case_id:      { type: uuid,      nullable: false,
                      fk: { entity: legal-case, column: id, on_delete: cascade } }
      client_name:  { type: string,    nullable: false }
      issue_date:   { type: date,      nullable: false }
      period_start: { type: date,      nullable: true }
      period_end:   { type: date,      nullable: true }
      subtotal:     { type: integer,   nullable: false }
      tax:          { type: integer,   nullable: false }
      total:        { type: integer,   nullable: false }
      status:       { type: enum,      values: [draft, issued, paid], nullable: false }
    constraints: []
    indexes:
      - { columns: [case_id] }
      - { columns: [status] }
    # DDL notes:
    #   client_name: 의뢰인 표시명 비정규화 스냅샷. 발행 시점 고정.
    #   subtotal: KRW 공급가액. time_entry.amount 합산.
    #   tax: KRW 부가세 10%. round(subtotal * 0.1).
    #   total: KRW = subtotal + tax.
    #   RLS: case-scoped (담당 변호사·파트너만). augment DDL 13_legal_invoice.sql 참조.
    #   RLS: attorney sees only their own queries.
