      label_id:   { type: uuid,    nullable: false,
                    fk: { entity: task-label, column: id, on_delete: cascade } }
    constraints:
      - { type: unique, columns: [task_id, label_id] }
    indexes:
      - { columns: [task_id] }
      - { columns: [label_id] }

  task-activity:
    domain: project
