dialect: hsqldb
# L2 full-test dialect (HSQLDB 2.x in-memory).
# Used by: presets/ddl/build/hsqldb-schema.sql (generated by render.py --dialect hsqldb)
# HSQLDB notes:
#   UUID — no native UUID type; use VARCHAR(36).
#   BOOLEAN — native BOOLEAN supported in HSQLDB 2.x.
#   TIMESTAMP — TIMESTAMP supported; renders as TIMESTAMP.
#   Identifier quoting — HSQLDB uses double-quote like ANSI SQL.
#   ON DELETE SET NULL — supported in HSQLDB 2.x.
type_map:
  uuid:      VARCHAR(36)
  string:    VARCHAR
  text:      LONGVARCHAR
  integer:   INTEGER
  decimal:   NUMERIC
  boolean:   BOOLEAN
  date:      DATE
  timestamp: TIMESTAMP
  enum:      VARCHAR   # rendered as VARCHAR(255) CHECK (col IN (...))
defaults:
  string_length: 255
  enum_length: 255
quote: '"'
on_delete_map:
  restrict:  RESTRICT
  cascade:   CASCADE
  set_null:  SET NULL
  no_action: NO ACTION
