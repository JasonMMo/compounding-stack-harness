# wire-v1.yaml — Middle wire-protocol contract v1
# Single source of truth for all adapter request/response schemas.
# Frontend and Backend adapters READ this file only — no redeclaration.
#
# Format choice: plain YAML with inline JSON-Schema-style type annotations.
# Rationale: OpenAPI 3.1 is the long-term target (see swappable-layers.md §8),
# but this first draft uses self-contained YAML to avoid toolchain dependency
# before adapters exist. Migration to OpenAPI 3.1 components/ is a CTO
# decision when the first adapter lands (M1).
#
# Key namespace: <domain>.<verb> — two-segment dotted path.
#   domain: auth | entity | project | status
#   verb:   login | logout | read | list | create | update | delete | health
#           | search-similar  (hyphenated multi-word verbs allowed; see project domain)
# Rationale: short enough to grep, long enough to be self-documenting.
# New domains added here as presets/skills/<industry> warrant.
#
# Idempotency column:
#   idempotent: true  — safe to replay (GET-equivalent semantics)
#   idempotent: false — mutating, replay may produce duplicates or errors
#
# HTTP query serialization (CTO decision, Growth-7):
#   Nested request fields (paging.mode, sort.field, sort.direction, ...) are
#   FLATTENED with underscore when carried as HTTP query parameters:
#     paging.mode    → paging_mode
#     paging.page    → paging_page
#     paging.size    → paging_size
#     paging.cursor  → paging_cursor
#     sort.field     → sort_field
#     sort.direction → sort_direction
#   Rationale: dot-notation in query strings has no RFC standard and parses
#   inconsistently across frameworks (Spring MVC drops "paging.mode" from its
#   param map — the exact defect QA caught in Growth-7). Flat underscore is
#   unambiguous for every backend adapter. Non-query transports (JSON request
#   body) MAY use the nested object form below directly.
#
# version: contract schema version (SemVer, adapter declares compat range).
version: "1.0.0"

# ── Error Envelope (shared definition) ────────────────────────────────────────
# Shape returned in every response `error` field on failure.
# Source of truth for code→http_status mapping: error/codes.yaml.
# On success the `error` field is null or absent.
#
#   error_envelope:
#     code:     string  — one of the code keys in error/codes.yaml (e.g. NOT_FOUND)
#     message:  string  — human-readable English text (adapter may localise)
#     details:  object  — optional, code-specific payload (e.g. field errors)
#
error_envelope:
  fields:
    code:
      type: string
      description: "Stable error token — clients branch on this, never on message text. Closed set defined in error/codes.yaml."
      required: true
    message:
      type: string
      description: "Human-readable description (English default). Adapter may override for i18n."
      required: true
    details:
      type: object
      required: false
      description: "Code-specific supplemental payload. Shape varies by code (see error/codes.yaml descriptions)."

keys:

  # ── auth domain ────────────────────────────────────────────────────────────

  auth.login:
    idempotent: false
    description: "Authenticate a user and issue a session token."
    request:
      fields:
        username:
          type: string
          required: true
          description: "Login identifier (email or username)."
        password:
          type: string
          required: true
          format: password
          description: "Plaintext credential — adapter MUST transmit over TLS."
        remember_me:
          type: boolean
          required: false
          default: false
    response:
      fields:
        token:
          type: string
          description: "Opaque session token. Adapter stores in secure storage."
        expires_at:
          type: string
          format: iso8601
          description: "UTC expiry timestamp."
        user_id:
          type: string
          description: "Stable user identifier."
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  auth.logout:
    idempotent: true
    description: "Invalidate the current session token."
    request:
      fields:
        token:
          type: string
          required: true
          description: "Session token to invalidate."
    response:
      fields:
        success:
          type: boolean
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  # ── entity domain ──────────────────────────────────────────────────────────
  # Generic CRUD over a named entity type. `entity_type` is resolved by the
  # adapter against the customer profile domains list.

  entity.read:
    idempotent: true
    description: "Fetch a single entity instance by primary key."
    request:
      fields:
        entity_type:
          type: string
          required: true
          description: "Slug matching profiles/<slug>.yaml domains[].slug."
        id:
          type: string
          required: true
          description: "Primary key value (string-serialised)."
    response:
      fields:
        entity_type:
          type: string
        id:
          type: string
        data:
          type: object
          description: "Entity field map. Shape defined by presets/ddl catalog."
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  entity.list:
    idempotent: true
    description: "Paginated list of entity instances, with optional filter."
    request:
      fields:
        entity_type:
          type: string
          required: true
        filter:
          type: object
          required: false
          description: "Key=value pairs applied as WHERE conditions."
        paging:
          type: object
          required: false
          description: "See middle/contract/paging/ specs. Default: offset page 1 size 20."
          fields:
            mode:
              type: string
              enum: [offset, cursor]
              default: offset
            page:
              type: integer
              required: false
            size:
              type: integer
              required: false
              default: 20
            cursor:
              type: string
              required: false
        sort:
          type: object
          required: false
          fields:
            field:
              type: string
            direction:
              type: string
              enum: [asc, desc]
              default: asc
    response:
      fields:
        entity_type:
          type: string
        items:
          type: array
          items:
            type: object
        total:
          type: integer
          description: "Total matching records (offset mode only)."
        next_cursor:
          type: string
          required: false
          description: "Cursor for next page (cursor mode only)."
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  entity.create:
    idempotent: false
    description: "Insert a new entity instance."
    request:
      fields:
        entity_type:
          type: string
          required: true
        data:
          type: object
          required: true
          description: "Field map. Adapter validates against DDL catalog schema."
    response:
      fields:
        entity_type:
          type: string
        id:
          type: string
          description: "Generated primary key of the new record."
        data:
          type: object
          description: "Persisted entity with server-populated defaults."
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  entity.update:
    idempotent: false
    description: "Partial update (PATCH semantics) of an existing entity."
    # CTO standard (Growth-5d): PATCH semantics 표준. PUT full-replace 가 필요한 adapter 는 wrapper 패턴으로 contract 변경 없이 구현.
    request:
      fields:
        entity_type:
          type: string
          required: true
        id:
          type: string
          required: true
        data:
          type: object
          required: true
          description: "Only the fields to change. Absent fields are unchanged."
    response:
      fields:
        entity_type:
          type: string
        id:
          type: string
        data:
          type: object
          description: "Full entity after update."
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  entity.delete:
    idempotent: true
    description: "Remove an entity instance by primary key."
    # CTO standard (Growth-5d): idempotent 표준 — 404 → success 매핑. adapter compliance test 가 "2회 호출 둘 다 success" 검증.
    request:
      fields:
        entity_type:
          type: string
          required: true
        id:
          type: string
          required: true
    response:
      fields:
        success:
          type: boolean
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  # ── project domain ─────────────────────────────────────────────────────────
  # Lite-AI value-add over the entity domain. Read-only, content-similarity
  # search across a single entity type (currently "task"). Backed by an optional
  # embedding service; degrades to lexical search when unavailable.

  project.search-similar:
    idempotent: true
    description: >-
      Content-similarity search over tasks. Returns ranked candidates plus a
      `mode` flag stating HOW results were ranked. Cloud API cost: zero —
      semantic mode uses a self-hosted embedding service, lexical mode is a
      local fallback. Callers MUST surface `mode` to the user as a badge
      (honesty contract — lexical results must never be labelled as AI/semantic).
    request:
      fields:
        query_text:
          type: string
          required: true
          description: "Free-text query. Empty/whitespace returns an empty list (mode=lexical, no backend call)."
        exclude_id:
          type: string
          required: false
          description: "Entity id to omit from results (e.g. the task being edited)."
        top_n:
          type: integer
          required: false
          default: 5
          description: "Max results. Clamped to [1, 50] by the adapter."
    response:
      fields:
        mode:
          type: string
          enum: [semantic, lexical]
          description: >-
            How results were ranked. `semantic` only when the embedding service
            is configured AND the call succeeded; `lexical` otherwise (env unset
            or embedding call failed → graceful fallback). ALWAYS present.
        items:
          type: array
          description: "Ranked matches. Each item is the full entity field map plus a `score`."
          items:
            type: object
            fields:
              id:
                type: string
              score:
                type: number
                description: "Relevance score (higher = closer). Scale depends on `mode`."
        total:
          type: integer
          description: "Number of items returned (== items length)."
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."

  # ── status domain ──────────────────────────────────────────────────────────

  status.health:
    idempotent: true
    description: "Liveness probe. Returns adapter + backend service health."
    request:
      fields: {}
      description: "No request parameters required."
    response:
      fields:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
          description: "Deployed contract version the adapter is serving."
        checks:
          type: array
          required: false
          description: "Optional per-component health sub-checks."
          items:
            type: object
            fields:
              name:
                type: string
              status:
                type: string
                enum: [ok, degraded, down]
              message:
                type: string
                required: false
        error:
          type: object
          required: false
          description: "Standard error envelope — see error_envelope and error/codes.yaml. Null on success."
