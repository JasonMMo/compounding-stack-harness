<!--
  tab-form.html — 한국 업무 화면 탭 기반 폼 스니펫
  패턴: 수평 탭 헤더 + 탭별 폼 패널 (eGovFrame 표준 레이아웃 호환)
  vanilla JS 탭 전환. htmx hx-get 로 lazy-load 가능.
-->
<style>
  /* ── 탭 컨테이너 ── */
  .tab-screen {
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #E9ECEF;
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }

  /* ── 탭 헤더 ── */
  .tab-header {
    display: flex;
    border-bottom: 2px solid #E9ECEF;
    padding: 0 4px;
    gap: 2px;
    background: #F8FAFC;
    border-radius: 6px 6px 0 0;
  }
  .tab-header button {
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    color: #6B7280;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    cursor: pointer;
    transition: color .12s, border-color .12s;
    white-space: nowrap;
  }
  .tab-header button:hover {
    color: #4F46E5;
  }
  .tab-header button.active {
    color: #4F46E5;
    border-bottom-color: #4F46E5;
    font-weight: 600;
  }

  /* ── 탭 패널 ── */
  .tab-panel {
    display: none;
    padding: 20px 24px;
  }
  .tab-panel.active {
    display: block;
  }

  /* ── 폼 그리드 (2열) ── */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 24px;
  }
  .form-grid .span-2 { grid-column: 1 / -1; }

  /* ── 필드 ── */
  .form-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-field label {
    font-size: 12px;
    font-weight: 600;
    color: #374151;
  }
  .form-field label .required {
    color: #EF4444;
    margin-left: 2px;
  }
  .form-field input,
  .form-field select,
  .form-field textarea {
    padding: 7px 10px;
    font-size: 13px;
    border: 1px solid #D1D5DB;
    border-radius: 4px;
    color: #111827;
    background: #fff;
    transition: border-color .12s;
  }
  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus {
    outline: none;
    border-color: #4F46E5;
    box-shadow: 0 0 0 3px rgba(79,70,229,.1);
  }

  /* ── 섹션 구분선 ── */
  .form-section-title {
    font-size: 13px;
    font-weight: 600;
    color: #4F46E5;
    padding-bottom: 6px;
    border-bottom: 1px solid #EEF2FF;
    margin-bottom: 4px;
    grid-column: 1 / -1;
  }

  /* ── 버튼 바 ── */
  .tab-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 24px;
    border-top: 1px solid #E9ECEF;
    background: #F8FAFC;
    border-radius: 0 0 6px 6px;
  }
  .tab-actions button {
    padding: 7px 20px;
    font-size: 13px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
  }
  .btn-primary {
    background: #4F46E5;
    color: #fff;
    border: none;
  }
  .btn-primary:hover { background: #4338CA; }
  .btn-secondary {
    background: #fff;
    color: #374151;
    border: 1px solid #D1D5DB;
  }
  .btn-secondary:hover { background: #F9FAFB; }
</style>

<!-- 사용 예시 -->
<div class="tab-screen">
  <div class="tab-header" role="tablist">
    <button class="active" onclick="switchTab(this,'tab-basic')" role="tab">기본 정보</button>
    <button onclick="switchTab(this,'tab-contact')" role="tab">연락처</button>
    <button onclick="switchTab(this,'tab-memo')" role="tab">메모</button>
  </div>

  <!-- 탭1: 기본 정보 -->
  <div id="tab-basic" class="tab-panel active" role="tabpanel">
    <div class="form-grid">
      <div class="form-section-title">기본 정보</div>
      <div class="form-field">
        <label>이름 <span class="required">*</span></label>
        <input type="text" name="name" placeholder="홍길동">
      </div>
      <div class="form-field">
        <label>부서 <span class="required">*</span></label>
        <select name="dept">
          <option value="">선택</option>
          <option>기획팀</option>
          <option>개발팀</option>
        </select>
      </div>
      <div class="form-field">
        <label>직위</label>
        <input type="text" name="position" placeholder="과장">
      </div>
      <div class="form-field">
        <label>입사일</label>
        <input type="date" name="join_date">
      </div>
    </div>
  </div>

  <!-- 탭2: 연락처 -->
  <div id="tab-contact" class="tab-panel" role="tabpanel">
    <div class="form-grid">
      <div class="form-section-title">연락처</div>
      <div class="form-field">
        <label>이메일</label>
        <input type="email" name="email" placeholder="hong@example.com">
      </div>
      <div class="form-field">
        <label>전화번호</label>
        <input type="tel" name="phone" placeholder="010-0000-0000">
      </div>
      <div class="form-field span-2">
        <label>주소</label>
        <input type="text" name="address" placeholder="서울특별시 강남구...">
      </div>
    </div>
  </div>

  <!-- 탭3: 메모 -->
  <div id="tab-memo" class="tab-panel" role="tabpanel">
    <div class="form-grid">
      <div class="form-section-title">메모</div>
      <div class="form-field span-2">
        <label>비고</label>
        <textarea name="memo" rows="5" placeholder="추가 메모를 입력하세요."></textarea>
      </div>
    </div>
  </div>

  <div class="tab-actions">
    <button class="btn-secondary" type="button">취소</button>
    <button class="btn-primary" type="submit">저장</button>
  </div>
</div>

<script>
  function switchTab(btn, panelId) {
    btn.closest('.tab-screen').querySelectorAll('.tab-header button').forEach(b => b.classList.remove('active'));
    btn.closest('.tab-screen').querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(panelId).classList.add('active');
  }
</script>
