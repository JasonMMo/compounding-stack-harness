<!--
  dense-table.html — 한국 SI/공공 Dense Table 스니펫
  패턴: Fixed Header(세로 고정) + Fixed Column(좌측 고정) + Hover Row
  vanilla-htmx 직접 사용. JS 의존 0 (overflow scroll 만).
  사용: Jinja2 {# block #} 로 감싸거나 htmx hx-get 응답으로 교체.
-->
<style>
  /* ── 래퍼 ── */
  .dense-table-wrap {
    overflow: auto;
    max-height: 480px;         /* 필요 시 조정 */
    border: 1px solid var(--table-border, #E9ECEF);
    border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    background: #fff;
  }

  /* ── 기본 테이블 ── */
  .dense-table {
    border-collapse: separate;
    border-spacing: 0;
    width: max-content;        /* 수평 스크롤 허용 */
    min-width: 100%;
    font-size: 13px;
    line-height: 1.4;
  }

  /* ── 헤더 (세로 고정) ── */
  .dense-table thead th {
    position: sticky;
    top: 0;
    z-index: 3;
    background: #F8FAFC;
    color: #374151;
    font-weight: 600;
    padding: 8px 12px;
    text-align: left;
    border-bottom: 2px solid #D1D5DB;
    white-space: nowrap;
  }

  /* ── 고정 첫 열 헤더 ── */
  .dense-table thead th:first-child {
    position: sticky;
    left: 0;
    z-index: 4;                /* 헤더 + 열 고정 → 최상위 */
  }

  /* ── 고정 첫 열 데이터 ── */
  .dense-table tbody td:first-child {
    position: sticky;
    left: 0;
    z-index: 1;
    background: #fff;
    border-right: 1px solid #E9ECEF;
    font-weight: 500;
  }

  /* ── 데이터 셀 ── */
  .dense-table tbody td {
    padding: 7px 12px;
    border-bottom: 1px solid #F0F0F0;
    white-space: nowrap;
    color: #111827;
  }

  /* ── 행 호버 ── */
  .dense-table tbody tr:hover td {
    background: #F8FAFC;
  }
  .dense-table tbody tr:hover td:first-child {
    background: #F1F5FE;
  }

  /* ── 호버 액션 (숨김→호버 노출) ── */
  .dense-table .row-actions {
    display: flex;
    gap: 6px;
    opacity: 0;
    transition: opacity .12s;
  }
  .dense-table tbody tr:hover .row-actions {
    opacity: 1;
  }
  .dense-table .row-actions button {
    font-size: 12px;
    padding: 2px 8px;
    border: 1px solid #D1D5DB;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    color: #374151;
  }
  .dense-table .row-actions button:hover {
    background: #EEF2FF;
    border-color: #4F46E5;
    color: #4F46E5;
  }

  /* ── 페이지네이션 바 ── */
  .dense-table-pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-top: 1px solid #E9ECEF;
    font-size: 13px;
    color: #6B7280;
  }
  .dense-table-pagination .page-btns {
    display: flex;
    gap: 4px;
  }
  .dense-table-pagination button {
    padding: 3px 10px;
    border: 1px solid #D1D5DB;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    color: #374151;
  }
  .dense-table-pagination button.active,
  .dense-table-pagination button:hover {
    background: #EEF2FF;
    border-color: #4F46E5;
    color: #4F46E5;
  }
</style>

<!-- 사용 예시 -->
<div class="dense-table-wrap">
  <table class="dense-table">
    <thead>
      <tr>
        <th>번호</th>          <!-- 고정 열 -->
        <th>이름</th>
        <th>부서</th>
        <th>직위</th>
        <th>등록일</th>
        <th>상태</th>
        <th style="min-width:100px">액션</th>
      </tr>
    </thead>
    <tbody>
      <!-- htmx: hx-get="/api/rows" hx-trigger="load" hx-target="tbody" -->
      <tr>
        <td>001</td>
        <td>홍길동</td>
        <td>기획팀</td>
        <td>과장</td>
        <td>2026-01-15</td>
        <td>활성</td>
        <td>
          <div class="row-actions">
            <button>수정</button>
            <button>삭제</button>
          </div>
        </td>
      </tr>
      <tr>
        <td>002</td>
        <td>이영희</td>
        <td>개발팀</td>
        <td>대리</td>
        <td>2026-02-20</td>
        <td>활성</td>
        <td>
          <div class="row-actions">
            <button>수정</button>
            <button>삭제</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<div class="dense-table-pagination">
  <span>총 <strong>42</strong>건 | 1–10 표시</span>
  <div class="page-btns">
    <button>‹</button>
    <button class="active">1</button>
    <button>2</button>
    <button>3</button>
    <button>›</button>
  </div>
</div>
