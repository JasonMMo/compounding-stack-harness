<!--
  krds-tab.html — KRDS 공식 탭 컴포넌트 스니펫 (v1.1.0)
  출처: krds-uiux/html/code/tab.html
  CDN 필요: krds.min.js 가 탭 전환 자동 처리 (JS 직접 작성 불필요)
  사용: stack.ui_theme = public-sector 고객 화면에서 tab-form.html 대신 사용
  접근성: ARIA tablist/tab/tabpanel 완전 구현
-->

<!--
  CDN (base.html 또는 layout에 1회만 삽입):
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/krds-uiux@1.1.0/resources/cdn/krds.min.css">
  <script src="https://cdn.jsdelivr.net/npm/krds-uiux@1.1.0/resources/cdn/krds.min.js"></script>
-->

<!-- tab -->
<div class="krds-tab-area layer">
  <!-- tab list -->
  <div class="tab line full">
    <ul role="tablist">
      <li id="tab_01" role="tab" aria-selected="true" aria-controls="panel_01" class="active">
        <button type="button" class="btn-tab">탭 1 <i class="sr-only created"> 선택됨</i></button>
      </li>
      <li id="tab_02" role="tab" aria-selected="false" aria-controls="panel_02">
        <button type="button" class="btn-tab">탭 2</button>
      </li>
      <li id="tab_03" role="tab" aria-selected="false" aria-controls="panel_03">
        <button type="button" class="btn-tab">탭 3</button>
      </li>
    </ul>
  </div>
  <!-- //tab list -->

  <!-- tab contents -->
  <div class="tab-conts-wrap">
    <section id="panel_01" aria-labelledby="tab_01" class="tab-conts active" data-quick-nav="false">
      <h3 class="sr-only">탭 1 영역</h3>
      <!-- 탭 1 내용 -->
    </section>
    <section id="panel_02" aria-labelledby="tab_02" class="tab-conts" data-quick-nav="false">
      <h3 class="sr-only">탭 2 영역</h3>
      <!-- 탭 2 내용 -->
    </section>
    <section id="panel_03" aria-labelledby="tab_03" class="tab-conts" data-quick-nav="false">
      <h3 class="sr-only">탭 3 영역</h3>
      <!-- 탭 3 내용 -->
    </section>
  </div>
  <!-- //tab contents -->
</div>
<!-- //tab -->
