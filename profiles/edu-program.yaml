version: 1

customer:
  slug: edu-program
  display: "대학 정부사업 관리 (시안)"   # 고객 노출 표시명 — 데모 네비/홈 헤딩에 그대로 렌더 (내부 slug 노출 금지)
  status: draft
  # PII 금지 — 실명·이메일·연락처 기재 없음
  industry: education
  size: 1                         # 담당자 1인 (Q4 확정)
  # note: 기관명 익명 처리. intake ID: 6de793e34dc72956

# ── Stack ────────────────────────────────────────────
stack:
  frontend: vanilla-htmx           # DB 이해도 없는 1인 담당자 → 단순 스택 적합
  backend:  fastapi                 # lawfirm-demo preview PASS 조합 유지

# ── DDL ──────────────────────────────────────────────
ddl:
  dialect: postgres                 # 확정: 학교 내부 서버 PostgreSQL (Q7)
  schema: edu_program

# ── Auth ─────────────────────────────────────────────
auth:
  method: local                     # 담당자 1인 (Q4) → SSO 불필요, local 인증

# ── Domains ──────────────────────────────────────────
# 포함 기준: catalog.yaml 실존 slug + domain-expert v2 매핑 채택 (Growth-38c reconcile, 2026-06-12).
# 미포함:
#   - 학사관리 전체 (Q9, 시나리오 B): 신규 entity 8개 이상 필요 → education vertical Phase 2
#   - LMS 실시간 연동 (Q10): Phase 2 별도 견적
domains:
  - slug: crm
    display: 학생 명단 및 지원·선발 관리
    entities: [contact, lead, activity]
    seen_at: 2026-06-12
    # contact: 학생 명단 (contact_type overlay → student, overlays 섹션 참고)
    # lead: 지원 접수(new) → 검토(contacted) → 합격(converted) / 불합격(disqualified)
    # activity: 심사 활동 기록 (type=meeting/note)
    # domain-expert v2 채택 (Growth-38c): CRM pipeline 으로 enrollment 흐름 구현

  - slug: project
    display: 사업 참여 학생 배정 관리
    entities: [project, resource-assignment]
    seen_at: 2026-06-12
    # project: 정부사업 1건을 project 로 모델링
    # resource-assignment: 합격 contact(student) → 사업 project 에 배정
    #   (employee_id 대신 contact_id, cross-domain app layer 처리)
    # domain-expert v2 채택 (Growth-38c): enrollment "등록 확정" 단계

  - slug: finance
    display: 사업비 집행 및 업체 지급
    entities: [account, journal-entry, invoice, payment]
    seen_at: 2026-06-12
    # account: 예산 세목 코드 (type=expense)
    # invoice: 업체 청구서 수취 (counterparty_id → procurement/vendor, AP 방향)
    # payment: 업체 지급 기록
    # journal-entry: 집행 전표
    # domain-expert v2 재확인: invoice AP 방향 사용 가능 (counterparty=vendor)
    # 한계: 예산 세목별 잔액 자동집계 불가 (budget-line 부재) → Phase 2

  - slug: procurement
    display: 거래 업체 관리
    entities: [vendor]
    seen_at: 2026-06-12
    # vendor: 사업비 지급 대상 업체 마스터

  - slug: asset
    display: 교육 기자재 관리
    entities: [asset, asset-category, maintenance-record]
    seen_at: 2026-06-12
    # 교육 기자재 장비 관리 (Q6). asset-category 에 '교육기자재' 코드 추가.

  - slug: document
    display: 사업 서류 관리
    entities: [document, document-version, document-category]
    seen_at: 2026-06-12
    # 증빙·공문 보관. document-category 에 '증빙서류' 코드 추가 (overlay).
    # document-version 으로 공유 버전 혼란 해결.

  - slug: reporting
    display: 사업 현황 보고
    entities: [report-definition, report-output]
    seen_at: 2026-06-12
    # 정부사업 정기 보고.

# ── Overlays ─────────────────────────────────────────
overlays:
  crm/contact:
    contact_type_extra_values: [student]
    notes: "정부사업 참여 학생. student = 사업 대상자. catalog enum 변경 없음 (domain-expert v2 권고 채택)."
  # 예산 세목 배정: finance/account.code 를 세목 코드로 임시 운용.
  # Phase 2 (education vertical): budget-line entity seed PR 후보.

# ── Security ─────────────────────────────────────────
security:
  data_residency: on-premise        # 학교 내부 서버 (Q7)
  self_host: required
  note: "DB 이해도 없음 — 운영 가이드 (DB 백업·복구 절차) 인도물 필수"

# ── Datasource ───────────────────────────────────────
datasource:
  username: ${EDU_PROGRAM_DB_USER}
  password: ${EDU_PROGRAM_DB_PASS}
  url_template: "jdbc:postgresql://{host}:{port}/{db}"
  host: "${EDU_PROGRAM_DB_HOST}"    # 학교 내부 서버 — 설치 시 확정
  port: 5432
  db: edu_program

# ── Overlay (shell) ──────────────────────────────────
overlay:
  shell_app_id: edu-program-portal
  vault_agent: false
  sso_keycloak: false
  feedback_url: https://intake.n9n.co.kr/   # 데모 푸터 "추가 요청·의견 남기기" CTA — 동일 이메일 재제출 시 같은 의뢰인 레코드에 누적

# ── Defaults ─────────────────────────────────────────
defaults:
  locale: ko-KR
  timezone: Asia/Seoul

# ── Cost tracking ────────────────────────────────────
billing:
  setup_cost_krw: 10000000         # 확정: 구축비 1,000만원 (Q5)
  llm_budget_usd_per_month: TBD    # 1인 담당자 사용 패턴 측정 후 확정
  prepaid_credits_usd: 0

# ── Open Loops (잔존) ─────────────────────────────────
#   1. 학사관리 시나리오 A(이수/출결) 확정 시 project/task + milestone 추가
#   2. LMS 연동: Phase 2 별도 견적 후 신규 loop 회전
#   3. crm/lead.source 'application' 없음 → 단기 other 임시 운용
#   4. project/resource-assignment.employee_id → contact_id 크로스도메인: app layer 처리 필요
#   5. finance/budget-line entity: education vertical Phase 2 catalog PR 후보
#   6. procurement/purchase-order: 집행 항목 세분화 필요 시 추가

escalation:
  - "enrollment 흐름: crm/lead → contact(student) → project/resource-assignment 로 14 baseline 내 커버. 전용 enrollment entity 는 Phase 2 education vertical 승격 후보 — CTO 판단"
  - "학사관리 시나리오 A/B: 고객 스코프 확인 후 결정. B(전체학사)는 education vertical 신설 전 착수 불가"
  - "budget-line (예산 세목): catalog 미존재, 교육·연구기관 반복 수요 — education vertical seed PR 후보 (CTO + CMO 보고 대기)"
  - "DB 이해도 없음: 운영 가이드 인도물 필수 — engineer·DevOps 인도 패키지에 반영"

notes:
  - "Growth-38 — intake 건1 초안 (PM, 2026-06-12)"
  - "Growth-38b — 10문항 전부 반영, domains 6개 확정 (PM, 2026-06-12)"
  - "Growth-38c — domain-expert v2 reconcile: enrollment crm+project 채택, invoice 복원, lead+activity 추가, project 도메인 신규 (PM+CTO, 2026-06-12)"
