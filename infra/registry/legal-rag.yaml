  를 프로세스 내에서 직접 추론, 추가 외부 SaaS 비용 없음. 모델은 이미지에 bake-in (런타임 offline).
  Growth-94 피벗: TEI(text-embeddings-inference cpu-1.5) 컨테이너 제거 — Rust hf-hub 다운로더의
  `relative URL without a base` 버그로 모델 다운로드 불가가 VPS 실증됨. 컨테이너 4→3 감소로 RAM 여유↑.
  embed 모델 CPU 상주 ~400-500MB. 추론 속도 제약 시 KVM4($15.99/월) 업그레이드 검토.
