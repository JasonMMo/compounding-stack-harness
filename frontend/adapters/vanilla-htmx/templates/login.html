{% extends "base.html" %}
{% block title %}로그인{% endblock %}

{% block nav %}
<nav class="top-nav" aria-label="주 탐색">
  <div class="nav-brand">
    <span class="nav-logo">Compounding Stack</span>
  </div>
</nav>
{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <h1 class="login-title">로그인</h1>

    {% if error %}
    <div role="alert" aria-live="assertive" class="error-banner">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{{ url_for('login_post') }}" novalidate>
      <div class="form-field">
        <label for="username" class="form-label">사용자명 <span aria-hidden="true" class="required-marker">*</span></label>
        <input
          id="username"
          name="username"
          type="text"
          class="form-input"
          autocomplete="username"
          aria-required="true"
          required
          autofocus
        >
      </div>

      <div class="form-field">
        <label for="password" class="form-label">비밀번호 <span aria-hidden="true" class="required-marker">*</span></label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          autocomplete="current-password"
          aria-required="true"
          required
        >
      </div>

      <div class="form-field form-field--checkbox">
        <label class="checkbox-label">
          <input type="checkbox" name="remember_me" value="1">
          로그인 상태 유지
        </label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-md">로그인</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
